<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Official Website</title>
  
  <!-- Google Fonts (Potta One & Fredoka) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=M+PLUS+Rounded+1c:wght@400;700;800&family=Outfit:wght@400;600;800&family=Potta+One&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      --primary: #ff758c;
      --primary-dark: #ff477e;
      --secondary: #6c5ce7;
      --bg-color: #fafbfc;
      --card-bg: #ffffff;
      --text-main: #2d3436;
      --text-muted: #636e72;
      --border-color: #edf2f7;
      --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
      --radius: 16px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: 'M PLUS Rounded 1c', sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      line-height: 1.6;
      background-size: cover;
      background-position: center top;
      background-repeat: no-repeat;
      background-attachment: fixed;
      overflow-x: hidden;
    }

    /* --- Loading Spinner --- */
    #loading {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(255, 255, 255, 0.95);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      transition: opacity 0.4s ease, visibility 0.4s;
    }
    .spinner {
      width: 50px;
      height: 50px;
      border: 5px solid var(--border-color);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* --- Header / Navigation --- */
    header {
      position: sticky;
      top: 0;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border-color);
      z-index: 1000;
      padding: 12px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .logo {
      font-family: 'Outfit', sans-serif;
      font-weight: 800;
      font-size: 1.25rem;
      color: var(--primary-dark);
      text-decoration: none;
    }
    nav ul {
      display: flex;
      gap: 16px;
      list-style: none;
    }
    nav a {
      text-decoration: none;
      color: var(--text-main);
      font-weight: 700;
      font-size: 0.9rem;
      transition: color 0.2s;
    }
    nav a:hover { color: var(--primary); }

    /* --- Common Section Styles --- */
    section {
      max-width: 1000px;
      margin: 0 auto;
      padding: 60px 20px;
    }
    .section-title {
      text-align: center;
      margin-bottom: 40px;
    }
    .section-title h2 {
      font-family: 'Outfit', sans-serif;
      font-size: 2rem;
      font-weight: 800;
      color: var(--primary);
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .section-title span {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    /* --- Profile Layout --- */
    .profile-section {
      max-width: 1050px;
      margin: 20px auto 50px;
      padding: 0 20px;
    }

    .profile-card {
      background: transparent;
      border-radius: 0;
      box-shadow: none;
      padding: 20px 0;
      position: relative;
      overflow: visible;
      display: block;
      min-height: 980px;
    }

    /* 立ち絵エリア：右側75%地点に配置 */
    .profile-visual-box {
      position: absolute;
      top: 20px;
      bottom: 20px;
      left: 75%;
      transform: translateX(-50%);
      height: calc(100% - 40px);
      width: auto;
      pointer-events: none;
      z-index: 1;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .profile-visual-box img {
      height: 100% !important;
      width: auto !important;
      max-width: none !important;
      min-width: 600px;
      object-fit: contain;
      filter: drop-shadow(0 15px 25px rgba(0, 0, 0, 0.15));
    }

    /* 左側コンテンツ */
    .profile-content-wrap {
      position: relative;
      z-index: 2;
      width: 55%;
      max-width: 550px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      font-family: 'Potta One', 'M PLUS Rounded 1c', cursive;
    }

    /* 名前 */
    .prof-title {
      font-family: 'Potta One', cursive;
      font-size: 3.8rem;
      font-weight: 400;
      color: #00158f;
      line-height: 1.1;
      letter-spacing: 1px;
      text-shadow: 
        0 0 8px #ffffff,
        0 0 15px #ffffff,
        2px 2px 0px #ffffff,
        3px 4px 8px rgba(0, 21, 143, 0.35);
    }

    /* サブタイトル */
    .prof-sub-title {
      font-family: 'Potta One', cursive;
      font-size: 1.35rem;
      color: #00158f;
      margin-top: 4px;
      margin-bottom: 12px;
      letter-spacing: 1px;
      text-shadow: 
        0 0 6px #ffffff,
        1px 1px 0px #ffffff,
        2px 2px 5px rgba(0, 21, 143, 0.3);
    }

    /* コメント・メッセージ */
    .profile-comment-block {
      width: 100%;
      margin-bottom: 8px;
    }
    .prof-comment-title {
      font-family: 'Potta One', cursive;
      font-size: 1.85rem;
      color: #00158f;
      margin-bottom: 6px;
      text-shadow: 
        0 0 6px #ffffff,
        1px 1px 0px #ffffff,
        2px 2px 6px rgba(0, 21, 143, 0.3);
    }
    .prof-message-text {
      font-family: 'Potta One', cursive;
      font-size: 1.1rem;
      color: #00158f;
      line-height: 1.6;
      min-height: 8em;
      word-break: break-word;
      white-space: pre-line;
      text-shadow: 
        0 0 6px #ffffff,
        1px 1px 0px #ffffff,
        2px 2px 4px rgba(0, 21, 143, 0.25);
    }

    /* ステータス行 */
    .profile-specs {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 12px;
      padding: 0;
      background: none;
      border: none;
      box-shadow: none;
    }

    .spec-row {
      display: flex;
      align-items: center;
      font-family: 'Potta One', cursive;
      font-size: 1.15rem;
      color: #00158f;
      white-space: nowrap;
      min-height: 1.6em;
      text-shadow: 
        0 0 6px #ffffff,
        1px 1px 0px #ffffff,
        2px 2px 5px rgba(0, 21, 143, 0.25);
    }
    .spec-row.space-top {
      margin-top: 8px;
    }
    .spec-label {
      width: 135px;
      letter-spacing: 1px;
      white-space: nowrap;
    }
    .spec-colon {
      width: 25px;
      text-align: center;
      white-space: nowrap;
    }
    .spec-value {
      font-family: 'Fredoka', 'Potta One', cursive;
      letter-spacing: 0.5px;
      white-space: nowrap;
    }

    /* クレジット */
    .profile-credits-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-family: 'Potta One', cursive;
      font-size: 1.05rem;
      color: #00158f;
      min-height: 7em;
      text-shadow: 
        0 0 6px #ffffff,
        1px 1px 0px #ffffff,
        2px 2px 5px rgba(0, 21, 143, 0.25);
    }

    /* アイコン */
    .visual-thumb-list {
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
      margin: 8px 0;
    }

    .visual-thumb-item {
      width: 65px;
      height: 65px;
      border-radius: 8px;
      overflow: hidden;
      position: relative;
      cursor: pointer;
      border: 2px solid transparent;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.08);
      transition: transform 0.2s, border-color 0.2s;
      background-color: #f1f2f6;
    }
    .visual-thumb-item:hover {
      transform: translateY(-2px);
    }
    .visual-thumb-item.active {
      border-color: #00158f;
      box-shadow: 0 0 0 2px rgba(0, 21, 143, 0.3);
    }

    .thumb-bg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 1;
    }

    .thumb-fg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      z-index: 2;
    }

    /* --- MV Video Slider --- */
    .profile-mv-container {
      width: 100%;
      background: #2b303c;
      border-radius: 12px;
      padding: 16px 14px 12px;
      margin-top: 10px;
      box-shadow: var(--shadow);
    }

    .mv-slider-wrapper {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      border-radius: 8px;
    }

    .mv-slides {
      display: flex;
      width: 100%;
      transition: transform 0.4s ease-in-out;
    }

    .mv-slide-item {
      min-width: 100%;
      position: relative;
      padding-bottom: 56.25%;
      height: 0;
      overflow: hidden;
    }

    .mv-slide-item iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
    }

    .mv-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(0, 0, 0, 0.65);
      color: #ffffff;
      border: none;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      cursor: pointer;
      z-index: 10;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 0.9rem;
      transition: background 0.2s;
    }
    .mv-btn:hover {
      background: rgba(0, 0, 0, 0.9);
    }
    .mv-btn-prev { left: 8px; }
    .mv-btn-next { right: 8px; }

    .mv-dots {
      display: flex;
      justify-content: center;
      gap: 6px;
      margin-top: 10px;
    }

    .mv-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.35);
      cursor: pointer;
      transition: background 0.2s, transform 0.2s;
    }
    .mv-dot.active {
      background: #00d2d3;
      transform: scale(1.2);
    }

    /* --- News / Notice (Rich Frosted Glass & Compact Media) --- */
    .notice-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
      max-height: 600px; /* ★高さを約2倍に拡張 */
      overflow-y: auto;
      
      /* リッチなフロストガラス調グラデーション */
      background: linear-gradient(145deg, rgba(35, 45, 60, 0.88), rgba(20, 26, 36, 0.94));
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 16px;
      padding: 24px 28px;
      
      /* 高級感のある二重フチ・立体シャドウ */
      border: 1px solid rgba(255, 255, 255, 0.18);
      box-shadow: 
        0 15px 35px rgba(0, 0, 0, 0.3),
        inset 0 1px 0 rgba(255, 255, 255, 0.2),
        inset 0 0 20px rgba(0, 0, 0, 0.2);
    }

    /* スクロールバー */
    .notice-list::-webkit-scrollbar {
      width: 6px;
    }
    .notice-list::-webkit-scrollbar-track {
      background: rgba(0, 0, 0, 0.15);
      border-radius: 4px;
    }
    .notice-list::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.25);
      border-radius: 4px;
    }
    .notice-list::-webkit-scrollbar-thumb:hover {
      background: rgba(255, 255, 255, 0.4);
    }

    .notice-item {
      display: flex;
      flex-direction: column;
      gap: 6px;
      background: transparent;
      box-shadow: none;
      padding: 0 0 16px 0;
      border-bottom: 1px dashed rgba(255, 255, 255, 0.15);
      border-radius: 0;
    }
    .notice-item:last-child {
      border-bottom: none;
      padding-bottom: 0;
    }

    .notice-date {
      font-size: 0.95rem;
      font-weight: 800;
      color: #64b5f6;
      font-family: 'Fredoka', 'Outfit', sans-serif;
      letter-spacing: 0.5px;
      text-shadow: 0 0 10px rgba(100, 181, 246, 0.4);
    }

    .notice-message {
      font-size: 0.95rem;
      font-weight: 500;
      color: #f1f2f6;
      line-height: 1.6;
      white-space: pre-line;
      word-break: break-word;
    }

    /* メディア表示（画像をコンパクトに制御） */
    .notice-media {
      margin-top: 10px;
      max-width: 100%;
    }
    
    /* ★添付画像のサイズを適度に小さく制限 */
    .notice-media img {
      max-width: 320px;          /* 横幅上限 */
      max-height: 180px;         /* 高さ上限 */
      width: auto;
      height: auto;
      object-fit: cover;
      border-radius: 10px;
      border: 1.5px solid rgba(255, 255, 255, 0.25);
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.35);
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .notice-media img:hover {
      transform: scale(1.02);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.45);
    }

    .notice-media .notice-video-wrap {
      position: relative;
      padding-bottom: 56.25%;
      height: 0;
      overflow: hidden;
      border-radius: 10px;
      max-width: 420px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.35);
    }
    .notice-media .notice-video-wrap iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
    }

    /* --- Visual / Gallery --- */
    .visual-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 20px;
    }
    .visual-card {
      background: var(--card-bg);
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: var(--shadow);
      cursor: pointer;
      transition: transform 0.2s;
    }
    .visual-card:hover { transform: translateY(-4px); }
    .visual-card img {
      width: 100%;
      height: 250px;
      object-fit: cover;
    }
    .visual-info {
      padding: 12px;
      font-size: 0.9rem;
      font-weight: bold;
      text-align: center;
    }

    /* --- Shop / Goods --- */
    .shop-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 24px;
    }
    .shop-card {
      background: var(--card-bg);
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
    }
    .shop-img {
      width: 100%;
      height: 200px;
      object-fit: cover;
    }
    .shop-body {
      padding: 20px;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
    }
    .shop-title {
      font-size: 1.1rem;
      font-weight: 700;
      margin-bottom: 8px;
    }
    .shop-price {
      color: var(--primary-dark);
      font-weight: 800;
      font-family: 'Outfit', sans-serif;
      margin-bottom: 12px;
    }
    .shop-desc {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 20px;
      flex-grow: 1;
    }
    .btn-buy {
      display: block;
      text-align: center;
      background: var(--primary);
      color: #fff;
      padding: 10px 0;
      border-radius: 8px;
      text-decoration: none;
      font-weight: bold;
      transition: background 0.2s;
    }
    .btn-buy:hover { background: var(--primary-dark); }

    /* --- Guideline (Accordion) --- */
    .guideline-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .guideline-item {
      background: var(--card-bg);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
    }
    .guideline-header {
      padding: 18px 24px;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      user-select: none;
    }
    .guideline-header i { transition: transform 0.3s; }
    .guideline-item.active .guideline-header i { transform: rotate(180deg); }
    .guideline-content {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.3s ease-out;
      padding: 0 24px;
      color: var(--text-muted);
      font-size: 0.9rem;
      white-space: pre-line;
    }
    .guideline-item.active .guideline-content {
      padding-bottom: 18px;
    }

    /* --- Modal --- */
    #modal {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.8);
      display: flex;
      justify-content: center;
      align-items: center;
      opacity: 0;
      visibility: hidden;
      transition: all 0.3s;
      z-index: 99999;
      padding: 20px;
    }
    #modal.show { opacity: 1; visibility: visible; }
    #modal img {
      max-width: 90%;
      max-height: 85vh;
      border-radius: 8px;
    }

    /* --- Footer --- */
    footer {
      background: #2d3436;
      color: #dfe6e9;
      text-align: center;
      padding: 40px 20px;
      font-size: 0.85rem;
    }
    .footer-links {
      margin-bottom: 16px;
      display: flex;
      gap: 16px;
      justify-content: center;
    }
    .footer-links a {
      color: #b2bec3;
      text-decoration: none;
    }
    .footer-links a:hover { color: #fff; }

    /* --- Social Buttons --- */
    .social-links {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }
    .social-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 30px;
      color: var(--text-main);
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 700;
      box-shadow: var(--shadow);
      transition: all 0.2s;
    }
    .social-btn:hover {
      transform: translateY(-2px);
      border-color: var(--primary);
      color: var(--primary);
    }

    /* スマホ対応 */
    @media (max-width: 860px) {
      nav { display: none; }
      .profile-card {
        padding: 24px;
        min-height: auto;
      }
      .profile-visual-box {
        position: relative;
        width: 100%;
        height: 360px;
        justify-content: center;
      }
      .profile-visual-box img {
        object-position: center;
      }
      .profile-content-wrap {
        width: 100%;
        max-width: 100%;
      }
      .prof-title {
        font-size: 2.3rem;
      }
    }
  </style>
</head>
<body>

  <!-- Loading Screen -->
  <div id="loading">
    <div class="spinner"></div>
    <p style="margin-top: 15px; font-weight: bold; color: var(--text-muted);">読み込み中...</p>
  </div>

  <!-- Header -->
  <header>
    <a href="#" class="logo" id="site-logo">PORTFOLIO</a>
    <nav>
      <ul>
        <li><a href="#notice">NEWS</a></li>
        <li><a href="#profile">PROFILE</a></li>
        <li><a href="#visual">GALLERY</a></li>
        <li><a href="#shop">GOODS</a></li>
        <li><a href="#guideline">GUIDELINE</a></li>
      </ul>
    </nav>
  </header>

  <!-- Profile Section -->
  <section id="profile" class="profile-section">
    <div class="profile-card">
      
      <!-- メイン立ち絵 -->
      <div class="profile-visual-box">
        <img id="prof-standing-img" src="" alt="Character Visual" style="display:none;">
      </div>

      <!-- 左側コンテンツエリア -->
      <div class="profile-content-wrap">
        <!-- 名前 & ふりがな/ローマ字 -->
        <div class="profile-header-group">
          <h1 id="prof-name" class="prof-title">-</h1>
          <div id="prof-sub" class="prof-sub-title">-</div>
        </div>

        <!-- コメント & メッセージ -->
        <div class="profile-comment-block">
          <h2 id="prof-comment" class="prof-comment-title"></h2>
          <p id="prof-message" class="prof-message-text"></p>
        </div>

        <!-- 詳細ステータスリスト -->
        <div class="profile-specs">
          <div class="spec-row">
            <span class="spec-label">誕生日</span>
            <span class="spec-colon">:</span>
            <span id="prof-birthday" class="spec-value">-</span>
          </div>
          <div class="spec-row">
            <span class="spec-label">年齢</span>
            <span class="spec-colon">:</span>
            <span id="prof-age" class="spec-value">-</span>
          </div>
          <div class="spec-row">
            <span class="spec-label">身長</span>
            <span class="spec-colon">:</span>
            <span id="prof-height" class="spec-value">-</span>
          </div>
          <div class="spec-row space-top">
            <span class="spec-label">ﾌｧﾝﾈｰﾑ</span>
            <span class="spec-colon">:</span>
            <span id="prof-fan-name" class="spec-value">-</span>
          </div>
          <div class="spec-row">
            <span class="spec-label">配信開始日</span>
            <span class="spec-colon">:</span>
            <span id="prof-streaming" class="spec-value">-</span>
          </div>
        </div>

        <!-- クレジット -->
        <div class="profile-credits-list" id="prof-credits"></div>

        <!-- アイコン一覧 -->
        <div class="visual-thumb-list" id="visual-thumb-list"></div>

        <!-- SNSリンク -->
        <div class="social-links" id="profile-links"></div>

        <!-- MVスライダー -->
        <div class="profile-mv-container" id="profile-mv-container" style="display:none;">
          <div class="mv-slider-wrapper">
            <button class="mv-btn mv-btn-prev" onclick="prevMvSlide()"><i class="fa-solid fa-chevron-left"></i></button>
            <div class="mv-slides" id="mv-slides"></div>
            <button class="mv-btn mv-btn-next" onclick="nextMvSlide()"><i class="fa-solid fa-chevron-right"></i></button>
          </div>
          <div class="mv-dots" id="mv-dots"></div>
        </div>

      </div>

    </div>
  </section>

  <!-- Notice Section -->
  <section id="notice">
    <div class="section-title">
      <h2>News</h2>
      <span>お知らせ</span>
    </div>
    <div class="notice-list" id="notice-list"></div>
  </section>

  <!-- Visual / Gallery Section -->
  <section id="visual">
    <div class="section-title">
      <h2>Gallery</h2>
      <span>ギャラリー・衣装</span>
    </div>
    <div class="visual-grid" id="visual-grid"></div>
  </section>

  <!-- Shop / Goods Section -->
  <section id="shop">
    <div class="section-title">
      <h2>Goods</h2>
      <span>グッズ・作品一覧</span>
    </div>
    <div class="shop-grid" id="shop-grid"></div>
  </section>

  <!-- Guideline Section -->
  <section id="guideline">
    <div class="section-title">
      <h2>Guideline</h2>
      <span>二次創作・活動規約</span>
    </div>
    <div class="guideline-list" id="guideline-list"></div>
  </section>

  <!-- Modal for Image Preview -->
  <div id="modal" onclick="closeModal()">
    <img id="modal-img" src="" alt="Preview">
  </div>

  <!-- Footer -->
  <footer>
    <div class="footer-links" id="footer-links"></div>
    <p id="footer-copy">&copy; Official Website. All rights reserved.</p>
  </footer>

  <!-- Script -->
  <script>
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbxsfZFysfM6B-kf2cnE6xSBzsbQ8JJRKCU4yQZbrqxsPSsKTY63VP-wkHAItKoafvTc/exec";

    function hideLoader() {
      const loader = document.getElementById('loading');
      if (loader) {
        loader.style.opacity = '0';
        setTimeout(() => { loader.style.visibility = 'hidden'; }, 400);
      }
    }

    // グローバル初期化
    async function init() {
      try {
        const res = await fetch(GAS_API_URL);
        const data = await res.json();
        
        try { renderProfile(data.profile, data.visual); } catch (e) { console.error('Profile Error:', e); }
        try { renderMvSlider(data.profile_mv); } catch (e) { console.error('MV Error:', e); }
        try { renderNotice(data.notice); } catch (e) { console.error('Notice Error:', e); }
        try { renderVisual(data.visual); } catch (e) { console.error('Visual Error:', e); }
        try { renderShop(data.shop); } catch (e) { console.error('Shop Error:', e); }
        try { renderGuideline(data.guideline); } catch (e) { console.error('Guideline Error:', e); }
        try { renderFooter(data.footer, data.global_regulations); } catch (e) { console.error('Footer Error:', e); }

      } catch (err) {
        console.error("データ取得エラー:", err);
      } finally {
        hideLoader();
      }
    }

    // 1. プロフィール & ビジュアルセレクター描画
    function renderProfile(profileData, visualData) {
      if (!profileData || profileData.length === 0) return;

      const p = {};
      profileData.forEach(row => {
        const key = row['項目'] || row['item'] || row['key'];
        const val = row['設定値'] || row['value'] || row['val'];
        if (key) {
          p[String(key).trim()] = (val !== undefined && val !== null) ? String(val).trim() : '';
        }
      });

      const formatDate = (valStr, showYear = true) => {
        if (!valStr || valStr === '') return '-';
        if (typeof valStr === 'string' && valStr.includes('T')) {
          const d = new Date(valStr);
          if (!isNaN(d.getTime())) {
            const m = d.getMonth() + 1;
            const day = d.getDate();
            return showYear ? `${d.getFullYear()}年${m}月${day}日` : `${m}月${day}日`;
          }
        }
        return valStr;
      };

      const getVal = (key, unit = '') => {
        if (p[key] && p[key] !== '') {
          return unit ? `${p[key]}${unit}` : p[key];
        }
        return '-';
      };

      // 名前 & サブタイトル
      document.getElementById('prof-name').textContent = getVal('name');
      const pron = p['pronunciation'] || '';
      const roma = p['romanization'] || '';
      let subText = '-';
      if (pron && roma) subText = `${pron} / ${roma}`;
      else if (pron || roma) subText = pron || roma;
      document.getElementById('prof-sub').textContent = subText;

      // コメント & メッセージ
      const commentEl = document.getElementById('prof-comment');
      const messageEl = document.getElementById('prof-message');
      if (p['comment']) {
        commentEl.textContent = p['comment'];
        commentEl.style.display = 'block';
      } else {
        commentEl.style.display = 'none';
      }
      if (p['message']) {
        messageEl.textContent = p['message'];
        messageEl.style.display = 'block';
      } else {
        messageEl.style.display = 'none';
      }

      // 詳細ステータス
      document.getElementById('prof-birthday').textContent = formatDate(p['birthday'], false);
      document.getElementById('prof-age').textContent = getVal('age', typeof p['age'] === 'number' || (p['age'] && !p['age'].includes('歳')) ? '歳' : '');
      document.getElementById('prof-height').textContent = getVal('height', typeof p['height'] === 'number' || (p['height'] && !p['height'].includes('cm')) ? 'cm' : '');
      document.getElementById('prof-fan-name').textContent = getVal('fan_name');
      document.getElementById('prof-streaming').textContent = formatDate(p['streaming'], true);

      // 立ち絵とクレジット更新
      const updateVisualDisplay = (item) => {
        const standingImg = document.getElementById('prof-standing-img');
        const visualSrc = item.visual_url || item.standing_url || p['standing_url'];
        if (visualSrc) {
          standingImg.src = visualSrc;
          standingImg.style.display = 'block';
        }

        const creditsContainer = document.getElementById('prof-credits');
        creditsContainer.innerHTML = '';
        const creditConfigs = [
          { key: 'character_design', label: 'キャラクター案' },
          { key: 'illustrator', label: 'イラストレータ' },
          { key: '2d_animation', label: '2Dデザイナー' },
          { key: '3d_modeling', label: '3Dモデリング' }
        ];

        creditConfigs.forEach(c => {
          const val = item[c.key] || p[c.key] || '';
          const row = document.createElement('div');
          row.className = 'spec-row';
          if (val && String(val).trim() !== '') {
            row.innerHTML = `<span class="spec-label">${c.label}</span><span class="spec-colon">:</span><span class="spec-value">${val}</span>`;
          } else {
            row.innerHTML = `<span class="spec-label" style="opacity:0;">${c.label}</span><span class="spec-colon" style="opacity:0;">:</span><span class="spec-value"></span>`;
          }
          creditsContainer.appendChild(row);
        });
      };

      // visualシートのアイコン一覧
      const thumbListContainer = document.getElementById('visual-thumb-list');
      thumbListContainer.innerHTML = '';

      const validVisualData = (visualData || []).filter(v => {
        return v && v.id !== undefined && v.id !== null && String(v.id).trim() !== '';
      });

      if (validVisualData.length > 0) {
        validVisualData.forEach((vItem, index) => {
          const thumbBox = document.createElement('div');
          thumbBox.className = `visual-thumb-item ${index === 0 ? 'active' : ''}`;

          if (vItem.thumb_background) {
            const bgImg = document.createElement('img');
            bgImg.className = 'thumb-bg';
            bgImg.src = vItem.thumb_background;
            thumbBox.appendChild(bgImg);
          }

          if (vItem.thumb_url) {
            const fgImg = document.createElement('img');
            fgImg.className = 'thumb-fg';
            fgImg.src = vItem.thumb_url;
            thumbBox.appendChild(fgImg);
          }

          thumbBox.addEventListener('click', () => {
            document.querySelectorAll('.visual-thumb-item').forEach(el => el.classList.remove('active'));
            thumbBox.classList.add('active');
            updateVisualDisplay(vItem);
          });

          thumbListContainer.appendChild(thumbBox);
        });

        updateVisualDisplay(validVisualData[0]);
      } else {
        updateVisualDisplay(p);
      }

      // SNSリンク
      const linksContainer = document.getElementById('profile-links');
      linksContainer.innerHTML = '';
      const snsConfigs = [
        { key: 'x_url', icon: 'fa-brands fa-x-twitter', label: 'X (Twitter)' },
        { key: 'youtube_url', icon: 'fa-brands fa-youtube', label: 'YouTube' },
        { key: 'sns_url-1', icon: 'fa-solid fa-link', label: 'SNS 1' },
        { key: 'sns_url-2', icon: 'fa-solid fa-link', label: 'SNS 2' },
        { key: 'sns_url-3', icon: 'fa-solid fa-link', label: 'SNS 3' }
      ];

      snsConfigs.forEach(sns => {
        if (p[sns.key]) {
          const a = document.createElement('a');
          a.href = p[sns.key];
          a.target = "_blank";
          a.rel = "noopener noreferrer";
          a.className = "social-btn";
          a.innerHTML = `<i class="${sns.icon}"></i> ${sns.label}`;
          linksContainer.appendChild(a);
        }
      });
    }

    // --- MV スライダー描画 & 制御 ---
    let currentMvIndex = 0;
    let totalMvSlides = 0;

    function renderMvSlider(mvData) {
      const container = document.getElementById('profile-mv-container');
      const slidesContainer = document.getElementById('mv-slides');
      const dotsContainer = document.getElementById('mv-dots');

      if (!mvData || mvData.length === 0) {
        container.style.display = 'none';
        return;
      }

      const activeMvs = mvData.filter(item => {
        const active = item.is_active || item.active;
        return active === true || String(active).toUpperCase() === 'TRUE' || active === 1 || active === '1';
      });

      if (activeMvs.length === 0) {
        container.style.display = 'none';
        return;
      }

      totalMvSlides = activeMvs.length;
      slidesContainer.innerHTML = '';
      dotsContainer.innerHTML = '';

      const convertYoutubeUrl = (url) => {
        if (!url) return '';
        const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
        const match = url.match(regExp);
        if (match && match[2].length === 11) {
          return `https://www.youtube.com/embed/${match[2]}`;
        }
        return url;
      };

      activeMvs.forEach((mv, index) => {
        const slide = document.createElement('div');
        slide.className = 'mv-slide-item';
        const embedUrl = convertYoutubeUrl(mv.mv_url || mv.url);
        slide.innerHTML = `<iframe src="${embedUrl}" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen loading="lazy"></iframe>`;
        slidesContainer.appendChild(slide);

        const dot = document.createElement('div');
        dot.className = `mv-dot ${index === 0 ? 'active' : ''}`;
        dot.addEventListener('click', () => goToMvSlide(index));
        dotsContainer.appendChild(dot);
      });

      container.style.display = 'block';
      goToMvSlide(0);
    }

    function updateMvSlidePosition() {
      const slides = document.getElementById('mv-slides');
      slides.style.transform = `translateX(-${currentMvIndex * 100}%)`;
      const dots = document.querySelectorAll('.mv-dot');
      dots.forEach((dot, idx) => {
        dot.classList.toggle('active', idx === currentMvIndex);
      });
    }

    function prevMvSlide() {
      if (totalMvSlides <= 1) return;
      currentMvIndex = (currentMvIndex - 1 + totalMvSlides) % totalMvSlides;
      updateMvSlidePosition();
    }

    function nextMvSlide() {
      if (totalMvSlides <= 1) return;
      currentMvIndex = (currentMvIndex + 1) % totalMvSlides;
      updateMvSlidePosition();
    }

    function goToMvSlide(index) {
      currentMvIndex = index;
      updateMvSlidePosition();
    }

    // 2. お知らせ描画（スプレッドシート notice シート対応）
    function renderNotice(noticeData) {
      const container = document.getElementById('notice-list');
      container.innerHTML = '';

      if (!noticeData || noticeData.length === 0) {
        container.innerHTML = '<p style="text-align:center; color:#dfe6e9; padding:20px;">お知らせはありません</p>';
        return;
      }

      const formatYmd = (valStr) => {
        if (!valStr) return '';
        if (typeof valStr === 'string' && valStr.includes('T')) {
          const d = new Date(valStr);
          if (!isNaN(d.getTime())) {
            const y = d.getFullYear();
            const m = String(d.getMonth() + 1).padStart(2, '0');
            const day = String(d.getDate()).padStart(2, '0');
            return `${y}-${m}-${day}`;
          }
        }
        const d = new Date(valStr);
        if (!isNaN(d.getTime()) && String(valStr).length >= 8) {
          const y = d.getFullYear();
          const m = String(d.getMonth() + 1).padStart(2, '0');
          const day = String(d.getDate()).padStart(2, '0');
          return `${y}-${m}-${day}`;
        }
        return String(valStr).trim();
      };

      const getEmbedUrl = (url) => {
        const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
        const match = url.match(regExp);
        return (match && match[2].length === 11) ? `https://www.youtube.com/embed/${match[2]}` : null;
      };

      // time_stamp が空欄のものを除外
      const validNotices = noticeData.filter(item => {
        const ts = item.time_stamp || item.timestamp;
        return ts !== undefined && ts !== null && String(ts).trim() !== '';
      });

      if (validNotices.length === 0) {
        container.innerHTML = '<p style="text-align:center; color:#dfe6e9; padding:20px;">お知らせはありません</p>';
        return;
      }

      validNotices.forEach(item => {
        const dateStr = formatYmd(item.time_stamp || item.timestamp);
        const msgStr = item.message || '';
        const picUrl = item.picture ? String(item.picture).trim() : '';

        const div = document.createElement('div');
        div.className = 'notice-item';

        let mediaHtml = '';
        if (picUrl) {
          const embedUrl = getEmbedUrl(picUrl);
          if (embedUrl) {
            mediaHtml = `
              <div class="notice-media">
                <div class="notice-video-wrap">
                  <iframe src="${embedUrl}" allowfullscreen loading="lazy"></iframe>
                </div>
              </div>`;
          } else {
            mediaHtml = `
              <div class="notice-media">
                <img src="${picUrl}" alt="Notice Image" onclick="openModal('${picUrl}')" loading="lazy">
              </div>`;
          }
        }

        div.innerHTML = `
          <span class="notice-date">${dateStr}</span>
          <div class="notice-message">${msgStr}</div>
          ${mediaHtml}
        `;
        container.appendChild(div);
      });
    }

    // 3. ギャラリー描画
    function renderVisual(visualData) {
      const container = document.getElementById('visual-grid');
      if (!visualData || visualData.length === 0) return;

      visualData.forEach(item => {
        const div = document.createElement('div');
        div.className = 'visual-card';
        div.onclick = () => openModal(item.image_url);
        div.innerHTML = `
          <img src="${item.image_url}" alt="${item.title || 'Gallery'}" loading="lazy">
          <div class="visual-info">${item.title || ''}</div>
        `;
        container.appendChild(div);
      });
    }

    // 4. ショップ・グッズ描画
    function renderShop(shopData) {
      const container = document.getElementById('shop-grid');
      if (!shopData || shopData.length === 0) return;

      shopData.forEach(item => {
        const div = document.createElement('div');
        div.className = 'shop-card';
        div.innerHTML = `
          <img class="shop-img" src="${item.image_url || 'https://via.placeholder.com/300'}" alt="${item.title}" loading="lazy">
          <div class="shop-body">
            <h3 class="shop-title">${item.title || ''}</h3>
            <div class="shop-price">${item.price || ''}</div>
            <p class="shop-desc">${item.description || ''}</p>
            <a href="${item.url || '#'}" target="_blank" rel="noopener noreferrer" class="btn-buy">
              購入・詳細はこちら <i class="fa-solid fa-arrow-up-right-from-square" style="font-size:0.8em;"></i>
            </a>
          </div>
        `;
        container.appendChild(div);
      });
    }

    // 5. ガイドライン描画（アコーディオン）
    function renderGuideline(guidelineData) {
      const container = document.getElementById('guideline-list');
      if (!guidelineData || guidelineData.length === 0) return;

      guidelineData.forEach(item => {
        const div = document.createElement('div');
        div.className = 'guideline-item';
        div.innerHTML = `
          <div class="guideline-header">
            <span>${item.title || ''}</span>
            <i class="fa-solid fa-chevron-down"></i>
          </div>
          <div class="guideline-content">
            <p>${item.content || ''}</p>
          </div>
        `;
        
        const header = div.querySelector('.guideline-header');
        const content = div.querySelector('.guideline-content');
        header.addEventListener('click', () => {
          const isActive = div.classList.toggle('active');
          content.style.maxHeight = isActive ? content.scrollHeight + 40 + 'px' : '0';
        });

        container.appendChild(div);
      });
    }

    // 6. フッター & グローバル設定
    function renderFooter(footerData, globalData) {
      if (globalData && globalData.length > 0) {
        const siteTitleItem = globalData.find(row => {
          const k = row.item || row['項目'] || row.key;
          return k === 'site_title';
        });
        const titleVal = siteTitleItem ? (siteTitleItem.value || siteTitleItem['設定値']) : (globalData[0].site_title || '');
        if (titleVal) {
          document.title = titleVal;
          document.getElementById('site-logo').textContent = titleVal;
        }

        const bgItem = globalData.find(row => {
          const k = row.item || row['項目'] || row.key;
          return k === 'page_background' || k === 'background';
        });
        const bgVal = bgItem ? (bgItem.value || bgItem['設定値']) : (globalData[0].page_background || globalData[0].background || '');
        if (bgVal) {
          document.body.style.backgroundImage = `url('${bgVal}')`;
        }
      }

      if (footerData && footerData.length > 0) {
        const container = document.getElementById('footer-links');
        footerData.forEach(f => {
          const a = document.createElement('a');
          a.href = f.url || '#';
          a.textContent = f.title || '';
          if (f.url && f.url.startsWith('http')) a.target = "_blank";
          container.appendChild(a);
        });
      }
    }

    // モーダル操作
    function openModal(imgSrc) {
      document.getElementById('modal-img').src = imgSrc;
      document.getElementById('modal').classList.add('show');
    }
    function closeModal() {
      document.getElementById('modal').classList.remove('show');
    }

    document.addEventListener('DOMContentLoaded', () => {
      init();
      setTimeout(hideLoader, 4000);
    });
  </script>
</body>
</html>
