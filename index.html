<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Official Website</title>
  
  <!-- Google Fonts & Font Awesome Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;800&family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      --primary: #ff758c;
      --primary-dark: #ff477e;
      --secondary: #6c5ce7;
      --bg-color: #fafbfc;
      --card-bg: #ffffff;
      --text-main: #2d3436;
      --text-muted: #636e72;
      --border-color: #edf2f7;
      --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
      --radius: 16px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: 'M PLUS Rounded 1c', sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      line-height: 1.6;
    }

    /* --- Loading Spinner --- */
    #loading {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(255, 255, 255, 0.95);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      transition: opacity 0.4s ease, visibility 0.4s;
    }
    .spinner {
      width: 50px;
      height: 50px;
      border: 5px solid var(--border-color);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* --- Header / Navigation --- */
    header {
      position: sticky;
      top: 0;
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border-color);
      z-index: 1000;
      padding: 12px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .logo {
      font-family: 'Outfit', sans-serif;
      font-weight: 800;
      font-size: 1.25rem;
      color: var(--primary-dark);
      text-decoration: none;
    }
    nav ul {
      display: flex;
      gap: 16px;
      list-style: none;
    }
    nav a {
      text-decoration: none;
      color: var(--text-main);
      font-weight: 700;
      font-size: 0.9rem;
      transition: color 0.2s;
    }
    nav a:hover { color: var(--primary); }

    /* --- Common Section Styles --- */
    section {
      max-width: 1000px;
      margin: 0 auto;
      padding: 60px 20px;
    }
    .section-title {
      text-align: center;
      margin-bottom: 40px;
    }
    .section-title h2 {
      font-family: 'Outfit', sans-serif;
      font-size: 2rem;
      font-weight: 800;
      color: var(--primary);
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .section-title span {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    /* --- Hero Section --- */
    .hero {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 40px 20px 60px;
      background: linear-gradient(180deg, #fff 0%, var(--bg-color) 100%);
    }
    .hero-img-box {
      width: 200px;
      height: 200px;
      border-radius: 50%;
      overflow: hidden;
      margin-bottom: 24px;
      box-shadow: var(--shadow);
      border: 4px solid #fff;
    }
    .hero-img-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .hero h1 {
      font-size: 2.2rem;
      margin-bottom: 10px;
    }
    .hero p {
      max-width: 600px;
      color: var(--text-muted);
      margin-bottom: 20px;
    }
    .social-links {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .social-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 30px;
      color: var(--text-main);
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 700;
      box-shadow: var(--shadow);
      transition: all 0.2s;
    }
    .social-btn:hover {
      transform: translateY(-2px);
      border-color: var(--primary);
      color: var(--primary);
    }

    /* --- News / Notice --- */
    .notice-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .notice-item {
      background: var(--card-bg);
      padding: 16px 20px;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      display: flex;
      gap: 16px;
      align-items: center;
    }
    .notice-date {
      font-size: 0.85rem;
      color: var(--text-muted);
      font-family: 'Outfit', sans-serif;
      white-space: nowrap;
    }
    .notice-tag {
      background: #ffe3e8;
      color: var(--primary-dark);
      padding: 2px 10px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: bold;
      white-space: nowrap;
    }
    .notice-title {
      font-weight: 700;
    }

    /* --- Visual / Gallery --- */
    .visual-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 20px;
    }
    .visual-card {
      background: var(--card-bg);
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: var(--shadow);
      cursor: pointer;
      transition: transform 0.2s;
    }
    .visual-card:hover { transform: translateY(-4px); }
    .visual-card img {
      width: 100%;
      height: 250px;
      object-fit: cover;
    }
    .visual-info {
      padding: 12px;
      font-size: 0.9rem;
      font-weight: bold;
      text-align: center;
    }

    /* --- Shop / Goods --- */
    .shop-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 24px;
    }
    .shop-card {
      background: var(--card-bg);
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
    }
    .shop-img {
      width: 100%;
      height: 200px;
      object-fit: cover;
    }
    .shop-body {
      padding: 20px;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
    }
    .shop-title {
      font-size: 1.1rem;
      font-weight: 700;
      margin-bottom: 8px;
    }
    .shop-price {
      color: var(--primary-dark);
      font-weight: 800;
      font-family: 'Outfit', sans-serif;
      margin-bottom: 12px;
    }
    .shop-desc {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 20px;
      flex-grow: 1;
    }
    .btn-buy {
      display: block;
      text-align: center;
      background: var(--primary);
      color: #fff;
      padding: 10px 0;
      border-radius: 8px;
      text-decoration: none;
      font-weight: bold;
      transition: background 0.2s;
    }
    .btn-buy:hover { background: var(--primary-dark); }

    /* --- Guideline (Accordion) --- */
    .guideline-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .guideline-item {
      background: var(--card-bg);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
    }
    .guideline-header {
      padding: 18px 24px;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      user-select: none;
    }
    .guideline-header i { transition: transform 0.3s; }
    .guideline-item.active .guideline-header i { transform: rotate(180deg); }
    .guideline-content {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.3s ease-out;
      padding: 0 24px;
      color: var(--text-muted);
      font-size: 0.9rem;
      white-space: pre-line;
    }
    .guideline-item.active .guideline-content {
      padding-bottom: 18px;
    }

    /* --- Modal --- */
    #modal {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.8);
      display: flex;
      justify-content: center;
      align-items: center;
      opacity: 0;
      visibility: hidden;
      transition: all 0.3s;
      z-index: 99999;
      padding: 20px;
    }
    #modal.show { opacity: 1; visibility: visible; }
    #modal img {
      max-width: 90%;
      max-height: 85vh;
      border-radius: 8px;
    }

    /* --- Footer --- */
    footer {
      background: #2d3436;
      color: #dfe6e9;
      text-align: center;
      padding: 40px 20px;
      font-size: 0.85rem;
    }
    .footer-links {
      margin-bottom: 16px;
      display: flex;
      gap: 16px;
      justify-content: center;
    }
    .footer-links a {
      color: #b2bec3;
      text-decoration: none;
    }
    .footer-links a:hover { color: #fff; }

    @media (max-width: 768px) {
      nav { display: none; } /* 簡易化のためモバイルではヘッダーメニューを省略 */
      .notice-item { flex-direction: column; align-items: flex-start; gap: 6px; }
      .hero h1 { font-size: 1.8rem; }
    }

    body {
      font-family: 'M PLUS Rounded 1c', sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      line-height: 1.6;
      /* ↓ ここから追加（背景画像を画面いっぱいに固定して表示） */
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
    }

    /* --- New Profile Layout --- */
    .profile-section {
      max-width: 1050px;
      margin: 20px auto 50px;
      padding: 0 20px;
    }

    .profile-card {
      background: #ffffff;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      display: flex;
      position: relative;
      overflow: hidden;
      padding: 40px;
     gap: 30px;
    }

    .profile-info {
      flex: 1 1 55%;
      z-index: 2;
      display: flex;
      flex-direction: column;
    }

    /* 名前・サブタイトル */
    .prof-title {
      font-size: 3rem;
      font-weight: 900;
      color: #00158f; /* 画像に合わせた深いブルー */
      line-height: 1.1;
      letter-spacing: -1px;
    }
    .prof-sub-title {
      font-size: 1.1rem;
      font-weight: 700;
      color: #00158f;
      margin-top: 6px;
      margin-bottom: 28px;
    }

    /* コメント・メッセージ */
    .profile-comment-block {
      margin-bottom: 25px;
    }
    .prof-comment-title {
      font-size: 1.5rem;
      font-weight: 800;
      color: #00158f;
      font-style: italic;
      margin-bottom: 8px;
    }
    .prof-message-text {
      font-size: 0.95rem;
      color: #00158f;
      font-style: italic;
      line-height: 1.5;
      white-space: pre-line;
    }

    /* スペックリスト（誕生日・身長など） */
    .profile-specs {
      display: flex;
      flex-direction: column;
      gap: 4px;
      margin-bottom: 30px;
    }
    .spec-row {
      display: flex;
      align-items: center;
      font-size: 0.95rem;
      font-weight: 700;
      color: #00158f;
    }
    .spec-row.space-top {
      margin-top: 10px;
    }
    .spec-label {
      width: 95px;
      letter-spacing: 0.5px;
    }
    .spec-colon {
      width: 25px;
      text-align: center;
    }
    .spec-value {
      font-family: 'Outfit', 'M PLUS Rounded 1c', sans-serif;
      letter-spacing: 0.5px;
    }

    /* クレジット & ミニアイコン */
    .profile-bottom-group {
      margin-top: auto;
      display: flex;
      align-items: flex-end;
      gap: 24px;
      flex-wrap: wrap;
    }
    .profile-credits {
      font-size: 0.85rem;
      font-weight: 700;
      color: #00158f;
      display: flex;
      flex-direction: column;
      gap: 3px;
      min-width: 200px;
    }

    /* 2層アイコンリスト */
    .visual-thumb-list {
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
    }

    /* 下地 + サムネイルの重なりコンテナ */
    .visual-thumb-item {
      width: 70px;
      height: 70px;
      border-radius: 8px;
      overflow: hidden;
      position: relative;
      cursor: pointer;
      border: 2px solid transparent;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
      transition: transform 0.2s, border-color 0.2s;
      background-color: #f1f2f6;
    }

    .visual-thumb-item:hover {
      transform: translateY(-2px);
    }

    .visual-thumb-item.active {
      border-color: #00158f;
      box-shadow: 0 0 0 2px rgba(0, 21, 143, 0.3);
    }

    /* 下地画像 */
    .thumb-bg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 1;
    }

    /* 前面サムネイル */
    .thumb-fg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      z-index: 2;
    }

    /* 立ち絵エリア */
    .profile-visual-box {
      flex: 1 1 45%;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      min-height: 450px;
    }
    .profile-visual-box img {
      max-width: 100%;
      max-height: 550px;
      object-fit: contain;
      filter: drop-shadow(0 15px 25px rgba(0, 0, 0, 0.15));
    }

    /* スマホ表示対応 */
    @media (max-width: 860px) {
      .profile-card {
        flex-direction: column-reverse;
        padding: 24px;
        gap: 20px;
      }
      .prof-title {
        font-size: 2.2rem;
      }
      .profile-visual-box {
        min-height: 300px;
      }
      .profile-visual-box img {
        max-height: 380px;
      }
      .profile-bottom-group {
        flex-direction: column-reverse;
        align-items: flex-start;
      }
    }
  </style>
</head>
<body>

  <!-- Loading Screen -->
  <div id="loading">
    <div class="spinner"></div>
    <p style="margin-top: 15px; font-weight: bold; color: var(--text-muted);">読み込み中...</p>
  </div>

  <!-- Header -->
  <header>
    <a href="#" class="logo" id="site-logo">PORTFOLIO</a>
    <nav>
      <ul>
        <li><a href="#notice">NEWS</a></li>
        <li><a href="#profile">PROFILE</a></li>
        <li><a href="#visual">GALLERY</a></li>
        <li><a href="#shop">GOODS</a></li>
        <li><a href="#guideline">GUIDELINE</a></li>
      </ul>
    </nav>
  </header>

  <!-- Profile Section (Image Layout) -->
  <section id="profile" class="profile-section">
    <div class="profile-card">
    
      <!-- 左側：テキスト・ステータス詳細 -->
      <div class="profile-info">
        <!-- 名前 & ふりがな/ローマ字 -->
        <div class="profile-header-group">
          <h1 id="prof-name" class="prof-title">-</h1>
          <div id="prof-sub" class="prof-sub-title">-</div>
        </div>

        <!-- コメント (サンプル見出し) & メッセージ -->
        <div class="profile-comment-block">
          <h2 id="prof-comment" class="prof-comment-title"></h2>
          <p id="prof-message" class="prof-message-text"></p>
        </div>

        <!-- 詳細ステータスリスト -->
        <div class="profile-specs">
          <div class="spec-row">
            <span class="spec-label">誕生日</span>
            <span class="spec-colon">:</span>
            <span id="prof-birthday" class="spec-value">-</span>
          </div>
          <div class="spec-row">
            <span class="spec-label">年齢</span>
            <span class="spec-colon">:</span>
            <span id="prof-age" class="spec-value">-</span>
          </div>
          <div class="spec-row">
            <span class="spec-label">身長</span>
            <span class="spec-colon">:</span>
            <span id="prof-height" class="spec-value">-</span>
          </div>
          <div class="spec-row space-top">
            <span class="spec-label">ﾌｧﾝﾈｰﾑ</span>
            <span class="spec-colon">:</span>
            <span id="prof-fan-name" class="spec-value">-</span>
          </div>
          <div class="spec-row">
            <span class="spec-label">配信開始日</span>
            <span class="spec-colon">:</span>
            <span id="prof-streaming" class="spec-value">-</span>
          </div>
        </div>

        <!-- 下部クレジット & アイコンセレクター -->
        <div class="profile-bottom-group">
          <div class="profile-credits" id="prof-credits"></div>
          <div class="visual-thumb-list" id="visual-thumb-list"></div>
        </div>

        <!-- SNSリンク -->
        <div class="social-links" id="profile-links" style="margin-top: 25px;"></div>
      </div>

      <!-- 右側：メイン立ち絵 -->
      <div class="profile-visual-box">
        <img id="prof-standing-img" src="" alt="Standing Character" style="display:none;">
      </div>

    </div>
  </section>

  <!-- Notice Section -->
  <section id="notice">
    <div class="section-title">
      <h2>News</h2>
      <span>お知らせ</span>
    </div>
    <div class="notice-list" id="notice-list"></div>
  </section>

  <!-- Visual / Gallery Section -->
  <section id="visual">
    <div class="section-title">
      <h2>Gallery</h2>
      <span>ギャラリー・衣装</span>
    </div>
    <div class="visual-grid" id="visual-grid"></div>
  </section>

  <!-- Shop / Goods Section -->
  <section id="shop">
    <div class="section-title">
      <h2>Goods</h2>
      <span>グッズ・作品一覧</span>
    </div>
    <div class="shop-grid" id="shop-grid"></div>
  </section>

  <!-- Guideline Section -->
  <section id="guideline">
    <div class="section-title">
      <h2>Guideline</h2>
      <span>二次創作・活動規約</span>
    </div>
    <div class="guideline-list" id="guideline-list"></div>
  </section>

  <!-- Modal for Image Preview -->
  <div id="modal" onclick="closeModal()">
    <img id="modal-img" src="" alt="Preview">
  </div>

  <!-- Footer -->
  <footer>
    <div class="footer-links" id="footer-links"></div>
    <p id="footer-copy">&copy; Official Website. All rights reserved.</p>
  </footer>

  <!-- Script -->
  <script>
    // ★★★ ここにデプロイしたGASのWeb API URLを貼り付けてください ★★★
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbxsfZFysfM6B-kf2cnE6xSBzsbQ8JJRKCU4yQZbrqxsPSsKTY63VP-wkHAItKoafvTc/exec";

    // グローバルで初期化処理
    async function init() {
      try {
        const res = await fetch(GAS_API_URL);
        const data = await res.json();
        
        // profileとvisualのデータを渡して描画
        renderProfile(data.profile, data.visual);
        renderNotice(data.notice);
        renderShop(data.shop);
        renderGuideline(data.guideline);
        renderFooter(data.footer, data.global_regulations);

      } catch (err) {
        console.error("データ取得エラー:", err);
      } finally {
        const loader = document.getElementById('loading');
        loader.style.opacity = '0';
        setTimeout(() => loader.style.visibility = 'hidden', 400);
      }
    }

    // 1. プロフィール & ビジュアルセレクター描画
    function renderProfile(profileData, visualData) {
      if (!profileData || profileData.length === 0) return;

      // A列(項目)をキー、B列(設定値)を値とするオブジェクトに変換
      const p = {};
      profileData.forEach(row => {
        const key = row['項目'] || row['item'] || row['key'];
        const val = row['設定値'] || row['value'] || row['val'];
        if (key) {
          p[String(key).trim()] = (val !== undefined && val !== null) ? String(val).trim() : '';
        }
      });

      // 日付フォーマットヘルパー（ISO文字列を YYYY年M月D日 に変換）
      const formatDate = (valStr) => {
        if (!valStr) return '-';
        if (typeof valStr === 'string' && valStr.includes('T')) {
          const d = new Date(valStr);
          if (!isNaN(d.getTime())) {
            return `${d.getFullYear()}年${d.getMonth() + 1}月${d.getDate()}日`;
          }
        }
        return valStr;
      };

      const getVal = (key, unit = '') => {
        if (p[key] && p[key] !== '') {
          return unit ? `${p[key]}${unit}` : p[key];
        }
        return '-';
      };

      // 名前・サブタイトル
      document.getElementById('prof-name').textContent = getVal('name');
      const pron = p['pronunciation'] || '';
      const roma = p['romanization'] || '';
      let subText = '-';
      if (pron && roma) subText = `${pron} / ${roma}`;
      else if (pron || roma) subText = pron || roma;
      document.getElementById('prof-sub').textContent = subText;

      // コメント・メッセージ
      const commentEl = document.getElementById('prof-comment');
      const messageEl = document.getElementById('prof-message');
      if (p['comment']) {
        commentEl.textContent = p['comment'];
        commentEl.style.display = 'block';
      } else {
        commentEl.style.display = 'none';
      }
      if (p['message']) {
        messageEl.textContent = p['message'];
        messageEl.style.display = 'block';
      } else {
        messageEl.style.display = 'none';
      }

      // 詳細ステータス
      document.getElementById('prof-birthday').textContent = getVal('birthday');
      document.getElementById('prof-age').textContent = getVal('age', typeof p['age'] === 'number' || (p['age'] && !p['age'].includes('歳')) ? '歳' : '');
      document.getElementById('prof-height').textContent = getVal('height', typeof p['height'] === 'number' || (p['height'] && !p['height'].includes('cm')) ? 'cm' : '');
      document.getElementById('prof-fan-name').textContent = getVal('fan_name');
      document.getElementById('prof-streaming').textContent = formatDate(p['streaming']);

      // 立ち絵とクレジットを更新する内部関数
      const updateVisualDisplay = (item) => {
        // メイン立ち絵の更新
        const standingImg = document.getElementById('prof-standing-img');
        const visualSrc = item.visual_url || item.standing_url || p['standing_url'];
        if (visualSrc) {
          standingImg.src = visualSrc;
          standingImg.style.display = 'block';
        }

        // クレジットの更新（空欄の場合は非表示）
        const creditsContainer = document.getElementById('prof-credits');
        creditsContainer.innerHTML = '';
        const creditConfigs = [
          { key: 'character_design', label: 'キャラクター案' },
          { key: 'illustrator', label: 'イラストレータ' },
          { key: '2d_animation', label: '2Dデザイナー' },
          { key: '3d_modeling', label: '3Dモデリング' }
        ];

        creditConfigs.forEach(c => {
          const val = item[c.key] || p[c.key];
          if (val && String(val).trim() !== '') {
            const row = document.createElement('div');
            row.className = 'spec-row';
            row.innerHTML = `<span style="width:105px;">${c.label}</span><span class="spec-colon">:</span><span>${val}</span>`;
            creditsContainer.appendChild(row);
          }
        });
      };

      // visualシートのアイコン一覧生成
      const thumbListContainer = document.getElementById('visual-thumb-list');
      thumbListContainer.innerHTML = '';

      if (visualData && visualData.length > 0) {
        visualData.forEach((vItem, index) => {
          const thumbBox = document.createElement('div');
          thumbBox.className = `visual-thumb-item ${index === 0 ? 'active' : ''}`;

          // 下地画像（thumb_background）
          if (vItem.thumb_background) {
            const bgImg = document.createElement('img');
            bgImg.className = 'thumb-bg';
            bgImg.src = vItem.thumb_background;
            thumbBox.appendChild(bgImg);
          }

          // 前面サムネイル（thumb_url）
          if (vItem.thumb_url) {
            const fgImg = document.createElement('img');
            fgImg.className = 'thumb-fg';
            fgImg.src = vItem.thumb_url;
            thumbBox.appendChild(fgImg);
          }

          // クリック時の切り替え
          thumbBox.addEventListener('click', () => {
            document.querySelectorAll('.visual-thumb-item').forEach(el => el.classList.remove('active'));
            thumbBox.classList.add('active');
            updateVisualDisplay(vItem);
          });

          thumbListContainer.appendChild(thumbBox);
        });

        // 初期表示（1件目のビジュアルとクレジットを表示）
        updateVisualDisplay(visualData[0]);
      } else {
        // visualデータがない場合はprofile側の情報でフォールバック
        updateVisualDisplay(p);
      }

      // SNSリンク生成
      const linksContainer = document.getElementById('profile-links');
      linksContainer.innerHTML = '';
      const snsConfigs = [
        { key: 'x_url', icon: 'fa-brands fa-x-twitter', label: 'X (Twitter)' },
        { key: 'youtube_url', icon: 'fa-brands fa-youtube', label: 'YouTube' },
        { key: 'sns_url-1', icon: 'fa-solid fa-link', label: 'SNS 1' },
        { key: 'sns_url-2', icon: 'fa-solid fa-link', label: 'SNS 2' },
        { key: 'sns_url-3', icon: 'fa-solid fa-link', label: 'SNS 3' }
      ];

      snsConfigs.forEach(sns => {
        if (p[sns.key]) {
          const a = document.createElement('a');
          a.href = p[sns.key];
          a.target = "_blank";
          a.rel = "noopener noreferrer";
          a.className = "social-btn";
          a.innerHTML = `<i class="${sns.icon}"></i> ${sns.label}`;
          linksContainer.appendChild(a);
        }
      });
    }
    
    // 2. お知らせ描画
    function renderNotice(noticeData) {
      const container = document.getElementById('notice-list');
      if (!noticeData || noticeData.length === 0) {
        container.innerHTML = '<p style="text-align:center; color:var(--text-muted);">お知らせはありません</p>';
        return;
      }
      noticeData.forEach(item => {
        const div = document.createElement('div');
        div.className = 'notice-item';
        div.innerHTML = `
          <span class="notice-date">${item.date || ''}</span>
          ${item.category ? `<span class="notice-tag">${item.category}</span>` : ''}
          <span class="notice-title">${item.title || ''}</span>
        `;
        container.appendChild(div);
      });
    }

    // 3. ギャラリー描画
    function renderVisual(visualData) {
      const container = document.getElementById('visual-grid');
      if (!visualData || visualData.length === 0) return;

      visualData.forEach(item => {
        const div = document.createElement('div');
        div.className = 'visual-card';
        div.onclick = () => openModal(item.image_url);
        div.innerHTML = `
          <img src="${item.image_url}" alt="${item.title || 'Gallery'}" loading="lazy">
          <div class="visual-info">${item.title || ''}</div>
        `;
        container.appendChild(div);
      });
    }

    // 4. ショップ・グッズ描画
    function renderShop(shopData) {
      const container = document.getElementById('shop-grid');
      if (!shopData || shopData.length === 0) return;

      shopData.forEach(item => {
        const div = document.createElement('div');
        div.className = 'shop-card';
        div.innerHTML = `
          <img class="shop-img" src="${item.image_url || 'https://via.placeholder.com/300'}" alt="${item.title}" loading="lazy">
          <div class="shop-body">
            <h3 class="shop-title">${item.title || ''}</h3>
            <div class="shop-price">${item.price || ''}</div>
            <p class="shop-desc">${item.description || ''}</p>
            <a href="${item.url || '#'}" target="_blank" rel="noopener noreferrer" class="btn-buy">
              購入・詳細はこちら <i class="fa-solid fa-arrow-up-right-from-square" style="font-size:0.8em;"></i>
            </a>
          </div>
        `;
        container.appendChild(div);
      });
    }

    // 5. ガイドライン描画（アコーディオン）
    function renderGuideline(guidelineData) {
      const container = document.getElementById('guideline-list');
      if (!guidelineData || guidelineData.length === 0) return;

      guidelineData.forEach(item => {
        const div = document.createElement('div');
        div.className = 'guideline-item';
        div.innerHTML = `
          <div class="guideline-header">
            <span>${item.title || ''}</span>
            <i class="fa-solid fa-chevron-down"></i>
          </div>
          <div class="guideline-content">
            <p>${item.content || ''}</p>
          </div>
        `;
        
        // アコーディオン開閉
        const header = div.querySelector('.guideline-header');
        const content = div.querySelector('.guideline-content');
        header.addEventListener('click', () => {
          const isActive = div.classList.toggle('active');
          content.style.maxHeight = isActive ? content.scrollHeight + 40 + 'px' : '0';
        });

        container.appendChild(div);
      });
    }

    // 6. フッター & グローバル設定
    function renderFooter(footerData, globalData) {
      if (globalData && globalData.length > 0) {
        // サイトタイトルの設定（item が site_title の場合、または直接カラム名の場合に対応）
        const siteTitleItem = globalData.find(row => row.item === 'site_title');
        if (siteTitleItem && siteTitleItem.value) {
          document.title = siteTitleItem.value;
          document.getElementById('site-logo').textContent = siteTitleItem.value;
        } else if (globalData[0].site_title) {
          document.title = globalData[0].site_title;
          document.getElementById('site-logo').textContent = globalData[0].site_title;
        }

        // ★ page_background の背景画像を設定
        const bgItem = globalData.find(row => row.item === 'page_background');
        if (bgItem && bgItem.value) {
          document.body.style.backgroundImage = `url('${bgItem.value}')`;
        }
      }

      // フッターリンクの描画
      if (footerData && footerData.length > 0) {
        const container = document.getElementById('footer-links');
        footerData.forEach(f => {
          const a = document.createElement('a');
          a.href = f.url || '#';
          a.textContent = f.title || '';
          if (f.url && f.url.startsWith('http')) a.target = "_blank";
          container.appendChild(a);
        });
      }
    }

    // モーダル操作
    function openModal(imgSrc) {
      document.getElementById('modal-img').src = imgSrc;
      document.getElementById('modal').classList.add('show');
    }
    function closeModal() {
      document.getElementById('modal').classList.remove('show');
    }

    document.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
