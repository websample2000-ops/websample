<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard | サイト管理</title>
  
  <!-- FontAwesome & Google Fonts -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=M+PLUS+Rounded+1c:wght@400;700;800&family=Outfit:wght@400;600;800&family=Potta+One&display=swap" rel="stylesheet">

  <style>
    :root {
      --primary: #ff758c;
      --primary-dark: #ff477e;
      --secondary: #6c5ce7;
      --bg: #f8fafc;
      --surface: #ffffff;
      --text: #1e293b;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --radius: 12px;
      --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'M PLUS Rounded 1c', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 24px 16px;
      min-height: 100vh;
    }

    .container { max-width: 1080px; margin: 0 auto; }
    
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      gap: 16px;
      flex-wrap: wrap;
    }
    .header-title {
      font-family: 'Outfit', sans-serif;
      font-size: 1.6rem;
      font-weight: 800;
      color: var(--primary-dark);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 22px;
      margin-bottom: 24px;
      box-shadow: var(--shadow);
    }

    .select-group {
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
    }

    select, input, textarea {
      width: 100%;
      padding: 10px 14px;
      border: 1.5px solid var(--border);
      border-radius: 8px;
      font-size: 0.95rem;
      background: #fff;
      font-family: inherit;
    }
    select:focus, input:focus, textarea:focus {
      outline: none;
      border-color: var(--primary);
    }

    select { width: auto; min-width: 240px; font-weight: bold; cursor: pointer; }

    button {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 10px 18px;
      border-radius: 8px;
      border: none;
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
      transition: all 0.2s;
    }
    button:hover { opacity: 0.88; transform: translateY(-1px); }
    button:active { transform: translateY(0); }
    button:disabled { opacity: 0.45; cursor: not-allowed; transform: none; }

    .btn-primary { background: var(--primary); color: #fff; }
    .btn-success { background: #10b981; color: #fff; }
    .btn-danger { background: #ef4444; color: #fff; }
    .btn-secondary { background: #64748b; color: #fff; }

    /* データ一覧テーブル */
    .table-wrap {
      overflow-x: auto;
      margin-top: 18px;
      max-height: 480px;
      border: 1px solid var(--border);
      border-radius: 8px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.88rem;
      text-align: left;
    }
    th, td {
      padding: 12px 14px;
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
      max-width: 260px;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    th { background: #f1f5f9; position: sticky; top: 0; z-index: 5; font-weight: 800; color: #475569; }
    tr:hover td { background: #f8fafc; }

    /* ログインモーダル */
    #login-overlay {
      position: fixed;
      inset: 0;
      background: rgba(30, 41, 59, 0.92);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 99999;
      padding: 20px;
    }
    .login-box {
      background: #ffffff;
      border-radius: 18px;
      padding: 36px 30px;
      width: 100%;
      max-width: 380px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.25);
      text-align: center;
    }
    .login-icon { font-size: 2.8rem; color: var(--primary); margin-bottom: 12px; }
    .login-box h2 { font-size: 1.35rem; color: var(--text); margin-bottom: 6px; font-weight: 800; }
    .login-box p { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 22px; font-weight: 600; }

    /* 編集・追加モーダル */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.55);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
      opacity: 0;
      visibility: hidden;
      transition: all 0.2s;
      z-index: 1000;
    }
    .modal-overlay.show { opacity: 1; visibility: visible; }
    .modal-box {
      background: #fff;
      border-radius: var(--radius);
      width: 100%;
      max-width: 580px;
      max-height: 88vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.2);
    }
    .modal-header {
      padding: 16px 22px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .modal-header h3 { font-size: 1.15rem; font-weight: 800; color: var(--text); }
    .modal-body {
      padding: 22px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .modal-footer {
      padding: 14px 22px;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: flex-end;
      gap: 10px;
    }
    .form-group label {
      display: block;
      font-size: 0.85rem;
      font-weight: 800;
      margin-bottom: 5px;
      color: #475569;
    }

    /* 通知トースト */
    #loading-toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: #1e293b;
      color: #fff;
      padding: 14px 22px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
      opacity: 0;
      visibility: hidden;
      transition: all 0.3s;
      z-index: 100000;
      font-weight: 600;
    }
    #loading-toast.show { opacity: 1; visibility: visible; }
  </style>
</head>
<body>

  <!-- ログイン画面 -->
  <div id="login-overlay">
    <div class="login-box">
      <div class="login-icon"><i class="fa-solid fa-user-shield"></i></div>
      <h2>管理者ログイン</h2>
      <p>アカウント名とパスワードを入力してください</p>
      
      <input type="text" id="login-account" placeholder="アカウント名" style="margin-bottom: 12px;" onkeydown="if(event.key==='Enter') submitLogin()">
      <input type="password" id="login-password" placeholder="パスワード" style="margin-bottom: 14px;" onkeydown="if(event.key==='Enter') submitLogin()">
      
      <div id="login-err-msg" style="color:#ef4444; font-size:0.82rem; margin-bottom:14px; font-weight:bold; display:none;"></div>
      
      <button class="btn-primary" id="btn-login" style="width:100%; justify-content:center; padding:12px 0;" onclick="submitLogin()">
        <i class="fa-solid fa-right-to-bracket"></i> ログイン
      </button>
    </div>
  </div>

  <!-- 管理画面本体 -->
  <div class="container">
    <header>
      <div class="header-title"><i class="fa-solid fa-sliders"></i> DASHBOARD</div>
      <div style="display:flex; gap:10px;">
        <button class="btn-success" onclick="openCreateModal()"><i class="fa-solid fa-plus"></i> 新規追加</button>
        <button class="btn-secondary" onclick="logout()"><i class="fa-solid fa-right-from-bracket"></i> ログアウト</button>
      </div>
    </header>

    <div class="card">
      <div class="select-group">
        <label for="sheet-select" style="font-weight:800;">編集シート:</label>
        <select id="sheet-select" onchange="loadCurrentSheetData()"></select>
        <button class="btn-secondary" onclick="loadCurrentSheetData()"><i class="fa-solid fa-rotate"></i> 再読込</button>
      </div>

      <div class="table-wrap">
        <table id="data-table">
          <thead><tr id="table-head"></tr></thead>
          <tbody id="table-body"></tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- 編集/追加モーダル -->
  <div class="modal-overlay" id="form-modal">
    <div class="modal-box">
      <div class="modal-header">
        <h3 id="modal-title">データ編集</h3>
        <button onclick="closeModal()" style="background:none; border:none; font-size:1.4rem; cursor:pointer; color:var(--text-muted);">&times;</button>
      </div>
      <div class="modal-body" id="modal-fields"></div>
      <div class="modal-footer">
        <button class="btn-secondary" onclick="closeModal()">キャンセル</button>
        <button class="btn-primary" id="btn-save" onclick="submitForm()"><i class="fa-solid fa-cloud-arrow-up"></i> 保存してGitHub反映</button>
      </div>
    </div>
  </div>

  <!-- トースト通知 -->
  <div id="loading-toast"><i class="fa-solid fa-spinner fa-spin"></i> <span id="toast-text">処理中...</span></div>

  <script>
    // ★ デプロイしたGASのウェブアプリURL（末尾 /exec）を設定してください
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbxOw2LRXYI_m7_nJyzYlt2GQblEzeseUfsr9s1-Q1oLRqHJSsIKYCYy7KBiFQ143CFA/exec";

    let currentHeaders = [];
    let currentRows = [];
    let editingRowIndex = null;

    function showToast(text) {
      document.getElementById('toast-text').textContent = text;
      document.getElementById('loading-toast').classList.add('show');
    }
    function hideToast() {
      document.getElementById('loading-toast').classList.remove('show');
    }

    // 初期化チェック
    window.onload = function() {
      const isAuthed = sessionStorage.getItem('admin_user_authed');
      if (isAuthed) {
        document.getElementById('login-overlay').style.display = 'none';
        initDashboard();
      }
    };

    // 1. ログイン送信
    async function submitLogin() {
      const acc = document.getElementById('login-account').value.trim();
      const pass = document.getElementById('login-password').value.trim();
      const errMsg = document.getElementById('login-err-msg');
      const btn = document.getElementById('btn-login');

      if (!acc || !pass) {
        errMsg.textContent = 'アカウント名とパスワードを入力してください';
        errMsg.style.display = 'block';
        return;
      }

      btn.disabled = true;
      btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> 認証中...';
      errMsg.style.display = 'none';

      try {
        const url = `${GAS_API_URL}?action=verifyAccount&account=${encodeURIComponent(acc)}&password=${encodeURIComponent(pass)}`;
        const res = await fetch(url);
        const data = await res.json();

        btn.disabled = false;
        btn.innerHTML = '<i class="fa-solid fa-right-to-bracket"></i> ログイン';

        if (data.success) {
          sessionStorage.setItem('admin_user_authed', data.user || acc);
          document.getElementById('login-overlay').style.display = 'none';
          initDashboard();
        } else {
          errMsg.textContent = data.message || '認証に失敗しました';
          errMsg.style.display = 'block';
        }
      } catch (err) {
        btn.disabled = false;
        btn.innerHTML = '<i class="fa-solid fa-right-to-bracket"></i> ログイン';
        errMsg.textContent = '通信エラーが発生しました: ' + err.message;
        errMsg.style.display = 'block';
      }
    }

    function logout() {
      sessionStorage.removeItem('admin_user_authed');
      location.reload();
    }

    // 2. ダッシュボード初期化
    async function initDashboard() {
      showToast('シート一覧を読み込み中...');
      try {
        const res = await fetch(`${GAS_API_URL}?action=getSheetList`);
        const sheets = await res.json();

        const sel = document.getElementById('sheet-select');
        sel.innerHTML = '';
        sheets.forEach(s => {
          const opt = document.createElement('option');
          opt.value = s;
          opt.textContent = s;
          sel.appendChild(opt);
        });

        loadCurrentSheetData();
      } catch (err) {
        hideToast();
        alert('シート一覧取得エラー: ' + err.message);
      }
    }

    // 3. 選択シートのデータ読み込み
    async function loadCurrentSheetData() {
      const sheetName = document.getElementById('sheet-select').value;
      if (!sheetName) return;

      showToast(`「${sheetName}」を読み込み中...`);
      try {
        const res = await fetch(`${GAS_API_URL}?action=getSheetData&sheetName=${encodeURIComponent(sheetName)}`);
        const data = await res.json();

        hideToast();
        currentHeaders = data.headers || [];
        currentRows = data.rows || [];
        renderTable();
      } catch (err) {
        hideToast();
        alert('データ取得エラー: ' + err.message);
      }
    }

    // 4. 一覧テーブル描画
    function renderTable() {
      const head = document.getElementById('table-head');
      const body = document.getElementById('table-body');
      head.innerHTML = '<th>操作</th>';
      body.innerHTML = '';

      currentHeaders.forEach(h => {
        const th = document.createElement('th');
        th.textContent = h;
        head.appendChild(th);
      });

      if (currentRows.length === 0) {
        body.innerHTML = `<tr><td colspan="${currentHeaders.length + 1}" style="text-align:center; padding:24px; color:#94a3b8;">データがありません</td></tr>`;
        return;
      }

      currentRows.forEach((row, idx) => {
        const tr = document.createElement('tr');
        
        const tdOp = document.createElement('td');
        tdOp.innerHTML = `
          <button class="btn-primary" style="padding:4px 8px; font-size:0.75rem;" onclick="openEditModal(${idx})"><i class="fa-solid fa-pen"></i></button>
          <button class="btn-danger" style="padding:4px 8px; font-size:0.75rem;" onclick="deleteRow(${row._rowIndex})"><i class="fa-solid fa-trash"></i></button>
        `;
        tr.appendChild(tdOp);

        currentHeaders.forEach(h => {
          const td = document.createElement('td');
          td.textContent = row[h] !== undefined ? row[h] : '';
          tr.appendChild(td);
        });
        body.appendChild(tr);
      });
    }

    // 5. モーダル表示
    function openCreateModal() {
      editingRowIndex = null;
      document.getElementById('modal-title').textContent = '新規データ追加';
      renderModalFields({});
      document.getElementById('form-modal').classList.add('show');
    }

    function openEditModal(rowIndexInArray) {
      const row = currentRows[rowIndexInArray];
      editingRowIndex = row._rowIndex;
      document.getElementById('modal-title').textContent = `行 ${editingRowIndex} の編集`;
      renderModalFields(row);
      document.getElementById('form-modal').classList.add('show');
    }

    function renderModalFields(data) {
      const container = document.getElementById('modal-fields');
      container.innerHTML = '';

      currentHeaders.forEach(h => {
        const grp = document.createElement('div');
        grp.className = 'form-group';
        grp.innerHTML = `<label>${h}</label>`;

        const val = data[h] !== undefined ? data[h] : '';
        if (String(h).includes('message') || String(h).includes('text') || String(h).includes('value')) {
          const textarea = document.createElement('textarea');
          textarea.rows = 3;
          textarea.id = `field-${h}`;
          textarea.value = val;
          grp.appendChild(textarea);
        } else {
          const input = document.createElement('input');
          input.type = 'text';
          input.id = `field-${h}`;
          input.value = val;
          grp.appendChild(input);
        }
        container.appendChild(grp);
      });
    }

    function closeModal() {
      document.getElementById('form-modal').classList.remove('show');
    }

    // 6. 保存＆同期
    async function submitForm() {
      const sheetName = document.getElementById('sheet-select').value;
      const rowData = {};

      currentHeaders.forEach(h => {
        rowData[h] = document.getElementById(`field-${h}`).value;
      });

      const btn = document.getElementById('btn-save');
      btn.disabled = true;
      showToast('シート保存 ＆ GitHub反映中...');

      try {
        const payload = {
          action: 'saveRow',
          sheetName: sheetName,
          rowIndex: editingRowIndex,
          rowData: rowData
        };

        const res = await fetch(GAS_API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // CORS preflight回避用
          body: JSON.stringify(payload)
        });
        const data = await res.json();

        hideToast();
        btn.disabled = false;

        if (data.success) {
          closeModal();
          alert(data.message);
          loadCurrentSheetData();
        } else {
          alert('更新エラー: ' + data.message);
        }
      } catch (err) {
        hideToast();
        btn.disabled = false;
        alert('通信エラー: ' + err.message);
      }
    }

    // 7. 削除＆同期
    async function deleteRow(rowIndex) {
      if (!confirm(`本当にこの行（行番号: ${rowIndex}）を削除してGitHubへ反映しますか？`)) return;

      const sheetName = document.getElementById('sheet-select').value;
      showToast('削除 ＆ GitHub反映中...');

      try {
        const payload = {
          action: 'deleteRow',
          sheetName: sheetName,
          rowIndex: rowIndex
        };

        const res = await fetch(GAS_API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(payload)
        });
        const data = await res.json();

        hideToast();
        if (data.success) {
          alert(data.message);
          loadCurrentSheetData();
        } else {
          alert('削除エラー: ' + data.message);
        }
      } catch (err) {
        hideToast();
        alert('通信エラー: ' + err.message);
      }
    }
  </script>
</body>
</html>
