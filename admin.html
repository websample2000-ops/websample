<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>サイト管理ダッシュボード</title>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=M+PLUS+Rounded+1c:wght@400;700;800&family=Outfit:wght@500;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --primary: #ff758c;
      --primary-dark: #ff477e;
      --primary-light: #fff0f3;
      --bg: #f1f5f9;
      --sidebar-bg: #1e293b;
      --surface: #ffffff;
      --text: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --radius: 12px;
      --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'M PLUS Rounded 1c', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
    }

    /* サイドバー */
    .sidebar {
      width: 240px;
      background: var(--sidebar-bg);
      color: #fff;
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      position: sticky;
      top: 0;
      height: 100vh;
    }
    .sidebar-header {
      padding: 20px 18px;
      font-family: 'Outfit', sans-serif;
      font-size: 1.3rem;
      font-weight: 800;
      color: var(--primary);
      border-bottom: 1px solid #334155;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .nav-list { list-style: none; padding: 12px 8px; flex: 1; overflow-y: auto; }
    .nav-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 14px;
      color: #94a3b8;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 700;
      font-size: 0.92rem;
      transition: all 0.2s;
      margin-bottom: 4px;
    }
    .nav-item:hover { background: #334155; color: #fff; }
    .nav-item.active { background: var(--primary); color: #fff; }
    .nav-item i { width: 20px; text-align: center; }

    .sidebar-footer {
      padding: 16px;
      border-top: 1px solid #334155;
    }

    /* メインコンテナ */
    .main-wrapper {
      flex: 1;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow-y: auto;
    }

    .top-header {
      background: #fff;
      border-bottom: 1px solid var(--border);
      padding: 14px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .top-title { font-weight: 800; font-size: 1.2rem; }

    .content-area {
      padding: 24px;
      max-width: 1200px;
      width: 100%;
      margin: 0 auto;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
      box-shadow: var(--shadow);
    }
    .card-title {
      font-size: 1.1rem;
      font-weight: 800;
      margin-bottom: 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* ボタン */
    button {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 16px;
      border-radius: 8px;
      border: none;
      font-weight: 700;
      font-size: 0.88rem;
      cursor: pointer;
      transition: all 0.2s;
    }
    button:hover { opacity: 0.88; transform: translateY(-1px); }
    button:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

    .btn-primary { background: var(--primary); color: #fff; }
    .btn-sync { background: #8b5cf6; color: #fff; font-size: 0.95rem; padding: 10px 20px; box-shadow: 0 4px 10px rgba(139,92,246,0.3); }
    .btn-success { background: #10b981; color: #fff; }
    .btn-danger { background: #ef4444; color: #fff; }
    .btn-secondary { background: #64748b; color: #fff; }

    /* 基本情報 (Profile) テーブル */
    .profile-table-wrap {
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
    }
    .profile-table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
    .profile-table tr { border-bottom: 1px solid var(--border); }
    .profile-table tr:last-child { border-bottom: none; }
    .profile-table th { background: #f8fafc; padding: 12px 16px; font-weight: 800; color: #475569; text-align: left; }
    .profile-table td { padding: 10px 16px; }
    .profile-key { font-weight: bold; color: #1e293b; width: 220px; vertical-align: top; padding-top: 14px; }
    .profile-input {
      width: 100%;
      padding: 8px 12px;
      border: 1.5px solid var(--border);
      border-radius: 6px;
      font-size: 0.9rem;
      font-family: inherit;
    }
    .profile-input:focus { outline: none; border-color: var(--primary); }
    .profile-desc { font-size: 0.75rem; color: #94a3b8; margin-top: 4px; font-weight: normal; }

    /* 通常データ一覧テーブル */
    .table-wrap {
      overflow-x: auto;
      border: 1px solid var(--border);
      border-radius: 8px;
      max-height: 600px;
    }
    table { width: 100%; border-collapse: collapse; font-size: 0.88rem; text-align: left; }
    th, td { padding: 12px 14px; border-bottom: 1px solid var(--border); white-space: nowrap; max-width: 260px; overflow: hidden; text-overflow: ellipsis; }
    th { background: #f8fafc; position: sticky; top: 0; z-index: 5; font-weight: 800; color: #475569; }
    tr:hover td { background: #f8fafc; }

    /* タブ切り替え（動画シート用） */
    .tab-group { display: flex; gap: 8px; margin-bottom: 16px; border-bottom: 2px solid var(--border); padding-bottom: 8px; }
    .tab-btn { background: none; color: var(--text-muted); border-radius: 6px; padding: 6px 14px; }
    .tab-btn.active { background: #e2e8f0; color: var(--text); font-weight: 800; }

    /* ログインモーダル */
    #login-overlay {
      position: fixed; inset: 0; background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(6px); display: flex; justify-content: center; align-items: center; z-index: 99999;
    }
    .login-box { background: #fff; border-radius: 16px; padding: 32px; width: 100%; max-width: 360px; text-align: center; }
    .login-box input { width: 100%; padding: 10px 14px; border: 1.5px solid var(--border); border-radius: 8px; margin-bottom: 12px; }

    /* 編集モーダル */
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.5); backdrop-filter: blur(3px);
      display: flex; justify-content: center; align-items: center; padding: 16px; opacity: 0; visibility: hidden; transition: all 0.2s; z-index: 1000;
    }
    .modal-overlay.show { opacity: 1; visibility: visible; }
    .modal-box { background: #fff; border-radius: var(--radius); width: 100%; max-width: 540px; max-height: 85vh; display: flex; flex-direction: column; }
    .modal-header { padding: 16px 20px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
    .modal-body { padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; }
    .modal-footer { padding: 14px 20px; border-top: 1px solid var(--border); display: flex; justify-content: flex-end; gap: 10px; }
    .form-group label { display: block; font-size: 0.82rem; font-weight: 800; margin-bottom: 4px; color: #475569; }
    .form-group input, .form-group textarea { width: 100%; padding: 8px 12px; border: 1px solid var(--border); border-radius: 6px; }

    #loading-toast {
      position: fixed; bottom: 24px; right: 24px; background: #1e293b; color: #fff;
      padding: 12px 20px; border-radius: 8px; display: flex; align-items: center; gap: 10px;
      box-shadow: 0 10px 15px rgba(0,0,0,0.2); opacity: 0; visibility: hidden; transition: all 0.3s; z-index: 100000;
    }
    #loading-toast.show { opacity: 1; visibility: visible; }
  </style>
</head>
<body>

  <!-- ログイン画面 -->
  <div id="login-overlay">
    <div class="login-box">
      <div style="font-size:2.4rem; color:var(--primary); margin-bottom:10px;"><i class="fa-solid fa-lock"></i></div>
      <h2 style="margin-bottom:6px;">管理者ログイン</h2>
      <p style="font-size:0.85rem; color:var(--text-muted); margin-bottom:20px;">アカウント名とパスワードを入力</p>
      <input type="text" id="login-account" placeholder="アカウント名" onkeydown="if(event.key==='Enter') submitLogin()">
      <input type="password" id="login-password" placeholder="パスワード" onkeydown="if(event.key==='Enter') submitLogin()">
      <div id="login-err-msg" style="color:#ef4444; font-size:0.8rem; margin-bottom:12px; display:none;"></div>
      <button class="btn-primary" id="btn-login" style="width:100%; justify-content:center; padding:10px 0;" onclick="submitLogin()">ログイン</button>
    </div>
  </div>

  <!-- サイドバー -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <i class="fa-solid fa-gem"></i> VTuber Admin
    </div>
    <ul class="nav-list">
      <li class="nav-item active" onclick="switchNav('profile', '基本プロフィール')"><i class="fa-solid fa-id-card"></i> 基本プロフィール</li>
      <li class="nav-item" onclick="switchNav('notice', 'お知らせ設定')"><i class="fa-solid fa-bullhorn"></i> お知らせ</li>
      <li class="nav-item" onclick="switchNav('visual', '立ち絵設定')"><i class="fa-solid fa-image"></i> 立ち絵</li>
      <li class="nav-item" onclick="switchNav('movies_priority', '動画設定')"><i class="fa-solid fa-play"></i> 動画</li>
      <li class="nav-item" onclick="switchNav('shop', 'ショップ設定')"><i class="fa-solid fa-bag-shopping"></i> ショップ</li>
      <li class="nav-item" onclick="switchNav('about', 'About設定')"><i class="fa-solid fa-circle-info"></i> About</li>
      <li class="nav-item" onclick="switchNav('guideline', 'ガイドライン設定')"><i class="fa-solid fa-book-bookmark"></i> ガイドライン</li>
      <li class="nav-item" onclick="switchNav('account', 'アカウント管理')"><i class="fa-solid fa-users-gear"></i> アカウント管理</li>
    </ul>
    <div class="sidebar-footer">
      <button class="btn-secondary" style="width:100%; justify-content:center;" onclick="logout()"><i class="fa-solid fa-right-from-bracket"></i> ログアウト</button>
    </div>
  </aside>

  <!-- メインコンテンツ -->
  <div class="main-wrapper">
    <header class="top-header">
      <div class="top-title" id="page-title">基本プロフィール</div>
      <button class="btn-sync" onclick="syncAllToGitHub()"><i class="fa-solid fa-rocket"></i> サイトへ反映（GitHubプッシュ）</button>
    </header>

    <div class="content-area">
      
      <!-- 1. 基本プロフィール (Profile) 編集ビュー -->
      <div class="card" id="profile-view">
        <div class="card-title">
          <span><i class="fa-solid fa-id-card" style="color:var(--primary);"></i> 基本情報設定</span>
          <div>
            <button class="btn-secondary" style="padding:6px 12px;" onclick="loadProfileData()"><i class="fa-solid fa-rotate"></i> 再読込</button>
            <button class="btn-primary" style="padding:6px 16px;" onclick="saveProfileAll()"><i class="fa-solid fa-floppy-disk"></i> スプレッドシートに保存</button>
          </div>
        </div>
        <div class="profile-table-wrap">
          <table class="profile-table">
            <thead>
              <tr>
                <th style="width: 220px;">項目名</th>
                <th>設定値</th>
              </tr>
            </thead>
            <tbody id="profile-body">
              <tr><td colspan="2" style="text-align:center; color:#94a3b8; padding:20px;">読み込み中...</td></tr>
            </tbody>
          </table>
        </div>
      </div>

      <!-- 2. 通常シート (Notice, Visual, Shop等) 一覧ビュー -->
      <div class="card" id="general-view" style="display:none;">
        <div class="tab-group" id="movie-tabs" style="display:none;">
          <button class="tab-btn active" id="tab-movie-prio" onclick="changeMovieTab('movies_priority')">優先動画 (movies_priority)</button>
          <button class="tab-btn" id="tab-movie-all" onclick="changeMovieTab('movies')">動画一覧 (movies)</button>
        </div>

        <div class="card-title">
          <span id="sub-card-title">データ一覧</span>
          <div>
            <button class="btn-secondary" style="padding:6px 12px;" onclick="loadCurrentTableData()"><i class="fa-solid fa-rotate"></i> 再読込</button>
            <button class="btn-success" style="padding:6px 12px;" onclick="openCreateModal()"><i class="fa-solid fa-plus"></i> 新規追加</button>
          </div>
        </div>

        <div class="table-wrap">
          <table>
            <thead><tr id="table-head"></tr></thead>
            <tbody id="table-body"></tbody>
          </table>
        </div>
      </div>

    </div>
  </div>

  <!-- 編集/追加モーダル -->
  <div class="modal-overlay" id="form-modal">
    <div class="modal-box">
      <div class="modal-header">
        <h3 id="modal-title">データ編集</h3>
        <button onclick="closeModal()" style="background:none; border:none; font-size:1.4rem; cursor:pointer;">&times;</button>
      </div>
      <div class="modal-body" id="modal-fields"></div>
      <div class="modal-footer">
        <button class="btn-secondary" onclick="closeModal()">キャンセル</button>
        <button class="btn-primary" id="btn-save-row" onclick="submitRowForm()"><i class="fa-solid fa-floppy-disk"></i> スプレッドシートに保存</button>
      </div>
    </div>
  </div>

  <div id="loading-toast"><i class="fa-solid fa-spinner fa-spin"></i> <span id="toast-text">処理中...</span></div>

  <script>
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbxYlAr1y9mOf_WSLpsmR42yt8aJZ4oxjys4Hheu59wxlbTR-GmgE1btDEI73s-BrBJr/exec";

    let currentActiveSheet = 'profile';
    let currentHeaders = [];
    let currentRows = [];
    let editingRowIndex = null;
    let profileRawRows = [];

    function showToast(text) {
      document.getElementById('toast-text').textContent = text;
      document.getElementById('loading-toast').classList.add('show');
    }
    function hideToast() {
      document.getElementById('loading-toast').classList.remove('show');
    }

    window.onload = function() {
      if (sessionStorage.getItem('admin_user_authed')) {
        document.getElementById('login-overlay').style.display = 'none';
        initApp();
      }
    };

    async function submitLogin() {
      const acc = document.getElementById('login-account').value.trim();
      const pass = document.getElementById('login-password').value.trim();
      const errMsg = document.getElementById('login-err-msg');
      const btn = document.getElementById('btn-login');

      if (!acc || !pass) {
        errMsg.textContent = 'アカウント名とパスワードを入力してください';
        errMsg.style.display = 'block';
        return;
      }

      btn.disabled = true;
      btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> 認証中...';
      errMsg.style.display = 'none';

      try {
        const res = await fetch(`${GAS_API_URL}?action=verifyAccount&account=${encodeURIComponent(acc)}&password=${encodeURIComponent(pass)}`);
        const data = await res.json();
        btn.disabled = false;
        btn.innerHTML = 'ログイン';

        if (data.success) {
          sessionStorage.setItem('admin_user_authed', data.user || acc);
          document.getElementById('login-overlay').style.display = 'none';
          initApp();
        } else {
          errMsg.textContent = data.message;
          errMsg.style.display = 'block';
        }
      } catch (err) {
        btn.disabled = false;
        btn.innerHTML = 'ログイン';
        errMsg.textContent = '通信エラー: ' + err.message;
        errMsg.style.display = 'block';
      }
    }

    function logout() {
      sessionStorage.removeItem('admin_user_authed');
      location.reload();
    }

    function initApp() {
      switchNav('profile', '基本プロフィール');
    }

    // 1. ナビゲーション切り替え
    function switchNav(sheetName, title) {
      currentActiveSheet = sheetName;
      document.getElementById('page-title').textContent = title;

      // サイドバーのアクティブクラス更新
      document.querySelectorAll('.nav-list .nav-item').forEach(el => {
        el.classList.remove('active');
        if (el.textContent.includes(title)) {
          el.classList.add('active');
        }
      });

      // profileビュー と 通常ビュー の表示切り替え
      const isProfile = (sheetName === 'profile');
      document.getElementById('profile-view').style.display = isProfile ? 'block' : 'none';
      document.getElementById('general-view').style.display = isProfile ? 'none' : 'block';

      // 動画タブの表示制御
      const isMovie = (sheetName === 'movies_priority' || sheetName === 'movies');
      document.getElementById('movie-tabs').style.display = isMovie ? 'flex' : 'none';

      if (isProfile) {
        loadProfileData();
      } else {
        loadCurrentTableData();
      }
    }

    function changeMovieTab(sheetName) {
      currentActiveSheet = sheetName;
      document.getElementById('tab-movie-prio').classList.toggle('active', sheetName === 'movies_priority');
      document.getElementById('tab-movie-all').classList.toggle('active', sheetName === 'movies');
      loadCurrentTableData();
    }

    // 2. 基本プロフィール (Profile) の読み込み & 描画
    async function loadProfileData() {
      showToast('基本プロフィールを読み込み中...');
      try {
        const res = await fetch(`${GAS_API_URL}?action=getSheetData&sheetName=profile`);
        const data = await res.json();
        hideToast();
        profileRawRows = data.rows || [];
        const tbody = document.getElementById('profile-body');
        tbody.innerHTML = '';

        if (profileRawRows.length === 0) {
          tbody.innerHTML = '<tr><td colspan="2" style="text-align:center; color:#94a3b8; padding:20px;">データがありません</td></tr>';
          return;
        }

        profileRawRows.forEach(row => {
          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td class="profile-key">
              ${row.key}
              ${row.desc ? `<div class="profile-desc">${row.desc}</div>` : ''}
            </td>
            <td>
              <input type="text" class="profile-input" id="prof-val-${row._rowIndex}" value="${row.value || ''}">
            </td>
          `;
          tbody.appendChild(tr);
        });
      } catch (err) {
        hideToast();
        console.error('Profile load error:', err);
      }
    }

    // 基本プロフィールの保存
    async function saveProfileAll() {
      showToast('基本プロフィールを保存中...');
      const payloadList = profileRawRows.map(row => ({
        rowIndex: row._rowIndex,
        value: document.getElementById(`prof-val-${row._rowIndex}`).value
      }));

      try {
        const res = await fetch(GAS_API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ action: 'saveProfileBatch', profileData: payloadList })
        });
        const resData = await res.json();
        hideToast();
        alert(resData.message);
      } catch (e) {
        hideToast();
        alert('保存エラー: ' + e.message);
      }
    }

    // 3. 通常シートのデータ読み込み & テーブル描画
    async function loadCurrentTableData() {
      showToast(`「${currentActiveSheet}」を読み込み中...`);
      try {
        const res = await fetch(`${GAS_API_URL}?action=getSheetData&sheetName=${encodeURIComponent(currentActiveSheet)}`);
        const data = await res.json();
        hideToast();

        currentHeaders = data.headers || [];
        currentRows = data.rows || [];
        renderTable();
      } catch (err) {
        hideToast();
        alert('読み込み失敗: ' + err.message);
      }
    }

    function renderTable() {
      const head = document.getElementById('table-head');
      const body = document.getElementById('table-body');
      head.innerHTML = '<th>操作</th>';
      body.innerHTML = '';

      currentHeaders.forEach(h => {
        const th = document.createElement('th');
        th.textContent = h;
        head.appendChild(th);
      });

      if (currentRows.length === 0) {
        body.innerHTML = `<tr><td colspan="${currentHeaders.length + 1}" style="text-align:center; padding:24px; color:#94a3b8;">データがありません</td></tr>`;
        return;
      }

      currentRows.forEach((row, idx) => {
        const tr = document.createElement('tr');
        const tdOp = document.createElement('td');
        tdOp.innerHTML = `
          <button class="btn-primary" style="padding:4px 8px; font-size:0.75rem;" onclick="openEditModal(${idx})"><i class="fa-solid fa-pen"></i></button>
          <button class="btn-danger" style="padding:4px 8px; font-size:0.75rem;" onclick="deleteRow(${row._rowIndex})"><i class="fa-solid fa-trash"></i></button>
        `;
        tr.appendChild(tdOp);

        currentHeaders.forEach(h => {
          const td = document.createElement('td');
          td.textContent = row[h] !== undefined ? row[h] : '';
          tr.appendChild(td);
        });
        body.appendChild(tr);
      });
    }

    // 4. モーダル
    function openCreateModal() {
      editingRowIndex = null;
      document.getElementById('modal-title').textContent = `${currentActiveSheet} に新規追加`;
      renderModalFields({});
      document.getElementById('form-modal').classList.add('show');
    }

    function openEditModal(rowIndexInArray) {
      const row = currentRows[rowIndexInArray];
      editingRowIndex = row._rowIndex;
      document.getElementById('modal-title').textContent = `${currentActiveSheet} の編集 (行: ${editingRowIndex})`;
      renderModalFields(row);
      document.getElementById('form-modal').classList.add('show');
    }

    function renderModalFields(data) {
      const container = document.getElementById('modal-fields');
      container.innerHTML = '';

      currentHeaders.forEach(h => {
        const grp = document.createElement('div');
        grp.className = 'form-group';
        grp.innerHTML = `<label>${h}</label>`;

        const val = data[h] !== undefined ? data[h] : '';
        if (String(h).includes('message') || String(h).includes('text') || String(h).includes('guideline') || String(h).includes('comment')) {
          const textarea = document.createElement('textarea');
          textarea.rows = 3;
          textarea.id = `field-${h}`;
          textarea.value = val;
          grp.appendChild(textarea);
        } else {
          const input = document.createElement('input');
          input.type = 'text';
          input.id = `field-${h}`;
          input.value = val;
          grp.appendChild(input);
        }
        container.appendChild(grp);
      });
    }

    function closeModal() {
      document.getElementById('form-modal').classList.remove('show');
    }

    // 5. 保存（スプレッドシートのみ）
    async function submitRowForm() {
      const rowData = {};
      currentHeaders.forEach(h => {
        rowData[h] = document.getElementById(`field-${h}`).value;
      });

      const btn = document.getElementById('btn-save-row');
      btn.disabled = true;
      showToast('シートに保存中...');

      try {
        const res = await fetch(GAS_API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({
            action: 'saveRow',
            sheetName: currentActiveSheet,
            rowIndex: editingRowIndex,
            rowData: rowData
          })
        });
        const resData = await res.json();
        hideToast();
        btn.disabled = false;

        if (resData.success) {
          closeModal();
          alert(resData.message);
          loadCurrentTableData();
        } else {
          alert('エラー: ' + resData.message);
        }
      } catch (err) {
        hideToast();
        btn.disabled = false;
        alert('通信エラー: ' + err.message);
      }
    }

    // 6. 削除（スプレッドシートのみ）
    async function deleteRow(rowIndex) {
      if (!confirm(`行番号: ${rowIndex} を削除しますか？`)) return;
      showToast('削除中...');

      try {
        const res = await fetch(GAS_API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({
            action: 'deleteRow',
            sheetName: currentActiveSheet,
            rowIndex: rowIndex
          })
        });
        const resData = await res.json();
        hideToast();
        if (resData.success) {
          alert(resData.message);
          loadCurrentTableData();
        }
      } catch (err) {
        hideToast();
        alert('通信エラー: ' + err.message);
      }
    }

    // 7. 一括GitHubプッシュ
    async function syncAllToGitHub() {
      if (!confirm('スプレッドシートの全データをJSON化してGitHub（本番サイト）へ反映しますか？')) return;
      showToast('GitHubへデータをプッシュ中...');

      try {
        const res = await fetch(GAS_API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ action: 'syncAllToGitHub' })
        });
        const resData = await res.json();
        hideToast();
        alert(resData.message);
      } catch (err) {
        hideToast();
        alert('GitHubプッシュエラー: ' + err.message);
      }
    }
  </script>
</body>
</html>
