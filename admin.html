<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>サイト管理ダッシュボード</title>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=M+PLUS+Rounded+1c:wght@400;700;800&family=Outfit:wght@500;700;800&display=swap" rel="stylesheet">
  <!-- js-yaml CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/js-yaml/4.1.0/js-yaml.min.js"></script>

  <style>
    :root {
      --primary: #ff758c;
      --primary-dark: #ff477e;
      --primary-light: #fff0f3;
      --bg: #f1f5f9;
      --sidebar-bg: #1e293b;
      --surface: #ffffff;
      --text: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --radius: 12px;
      --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'M PLUS Rounded 1c', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
    }

    /* サイドバー */
    .sidebar {
      width: 240px;
      background: var(--sidebar-bg);
      color: #fff;
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      position: sticky;
      top: 0;
      height: 100vh;
    }
    .sidebar-header {
      padding: 20px 18px;
      font-family: 'Outfit', sans-serif;
      font-size: 1.3rem;
      font-weight: 800;
      color: var(--primary);
      border-bottom: 1px solid #334155;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .nav-list { list-style: none; padding: 12px 8px; flex: 1; overflow-y: auto; }
    .nav-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 14px;
      color: #94a3b8;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 700;
      font-size: 0.92rem;
      transition: all 0.2s;
      margin-bottom: 4px;
    }
    .nav-item:hover { background: #334155; color: #fff; }
    .nav-item.active { background: var(--primary); color: #fff; }
    .nav-item i { width: 20px; text-align: center; }

    .sidebar-footer {
      padding: 16px;
      border-top: 1px solid #334155;
    }

    /* メインコンテナ */
    .main-wrapper {
      flex: 1;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow-y: auto;
    }

    .top-header {
      background: #fff;
      border-bottom: 1px solid var(--border);
      padding: 14px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .top-title { font-weight: 800; font-size: 1.2rem; }

    .content-area {
      padding: 24px;
      max-width: 1200px;
      width: 100%;
      margin: 0 auto;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
      box-shadow: var(--shadow);
    }
    .card-title {
      font-size: 1.1rem;
      font-weight: 800;
      margin-bottom: 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* ボタン */
    button {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 16px;
      border-radius: 8px;
      border: none;
      font-weight: 700;
      font-size: 0.88rem;
      cursor: pointer;
      transition: all 0.2s;
    }
    button:hover { opacity: 0.88; transform: translateY(-1px); }
    button:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

    .btn-primary { background: var(--primary); color: #fff; }
    .btn-sync { background: #8b5cf6; color: #fff; font-size: 0.95rem; padding: 10px 20px; box-shadow: 0 4px 10px rgba(139,92,246,0.3); }
    .btn-success { background: #10b981; color: #fff; }
    .btn-danger { background: #ef4444; color: #fff; }
    .btn-secondary { background: #64748b; color: #fff; }

    /* 基本情報 (Profile) テーブル */
    .profile-table-wrap {
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
    }
    .profile-table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
    .profile-table tr { border-bottom: 1px solid var(--border); }
    .profile-table tr:last-child { border-bottom: none; }
    .profile-table th { background: #f8fafc; padding: 12px 16px; font-weight: 800; color: #475569; text-align: left; }
    .profile-table td { padding: 10px 16px; }
    .profile-key { font-weight: bold; color: #1e293b; width: 240px; vertical-align: top; padding-top: 14px; }
    .profile-input, .profile-select {
      width: 100%;
      padding: 8px 12px;
      border: 1.5px solid var(--border);
      border-radius: 6px;
      font-size: 0.9rem;
      font-family: inherit;
    }
    .profile-input:focus, .profile-select:focus { outline: none; border-color: var(--primary); }
    .profile-desc { font-size: 0.75rem; color: #94a3b8; margin-top: 4px; font-weight: normal; }
    .required-badge { color: #ef4444; font-size: 0.75rem; font-weight: 800; margin-left: 4px; }

    /* 通常データ一覧テーブル */
    .table-wrap {
      overflow-x: auto;
      border: 1px solid var(--border);
      border-radius: 8px;
      max-height: 600px;
    }
    table { width: 100%; border-collapse: collapse; font-size: 0.88rem; text-align: left; }
    th, td { padding: 12px 14px; border-bottom: 1px solid var(--border); white-space: nowrap; max-width: 260px; overflow: hidden; text-overflow: ellipsis; }
    th { background: #f8fafc; position: sticky; top: 0; z-index: 5; font-weight: 800; color: #475569; }
    tr:hover td { background: #f8fafc; }

    /* ログインモーダル */
    #login-overlay {
      position: fixed; inset: 0; background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(6px); display: flex; justify-content: center; align-items: center; z-index: 99999;
    }
    .login-box { background: #fff; border-radius: 16px; padding: 32px; width: 100%; max-width: 360px; text-align: center; }
    .login-box input { width: 100%; padding: 10px 14px; border: 1.5px solid var(--border); border-radius: 8px; margin-bottom: 12px; }

    /* 編集モーダル */
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.5); backdrop-filter: blur(3px);
      display: flex; justify-content: center; align-items: center; padding: 16px; opacity: 0; visibility: hidden; transition: all 0.2s; z-index: 1000;
    }
    .modal-overlay.show { opacity: 1; visibility: visible; }
    .modal-box { background: #fff; border-radius: var(--radius); width: 100%; max-width: 580px; max-height: 85vh; display: flex; flex-direction: column; }
    .modal-header { padding: 16px 20px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
    .modal-body { padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; }
    .modal-footer { padding: 14px 20px; border-top: 1px solid var(--border); display: flex; justify-content: flex-end; gap: 10px; }
    
    .form-group label { display: block; font-size: 0.82rem; font-weight: 800; margin-bottom: 4px; color: #475569; }
    .form-group input, .form-group textarea, .form-group select {
      width: 100%; padding: 8px 12px; border: 1.5px solid var(--border); border-radius: 6px; font-size: 0.9rem; font-family: inherit;
    }
    .form-group input:focus, .form-group textarea:focus, .form-group select:focus {
      outline: none; border-color: var(--primary);
    }

    /* プレビュー枠 */
    .field-preview { margin-top: 6px; display: inline-block; max-height: 80px; border-radius: 4px; border: 1px solid var(--border); overflow: hidden; }
    .field-preview img { height: 100%; max-height: 80px; object-fit: cover; display: block; }

    #loading-toast {
      position: fixed; bottom: 24px; right: 24px; background: #1e293b; color: #fff;
      padding: 12px 20px; border-radius: 8px; display: flex; align-items: center; gap: 10px;
      box-shadow: 0 10px 15px rgba(0,0,0,0.2); opacity: 0; visibility: hidden; transition: all 0.3s; z-index: 100000;
    }
    #loading-toast.show { opacity: 1; visibility: visible; }
  </style>
</head>
<body>

  <!-- ログイン画面 -->
  <div id="login-overlay">
    <div class="login-box">
      <div style="font-size:2.4rem; color:var(--primary); margin-bottom:10px;"><i class="fa-solid fa-lock"></i></div>
      <h2 style="margin-bottom:6px;">管理者ログイン</h2>
      <p style="font-size:0.85rem; color:var(--text-muted); margin-bottom:20px;">アカウント名とパスワードを入力</p>
      <input type="text" id="login-account" placeholder="アカウント名" onkeydown="if(event.key==='Enter') submitLogin()">
      <input type="password" id="login-password" placeholder="パスワード" onkeydown="if(event.key==='Enter') submitLogin()">
      <div id="login-err-msg" style="color:#ef4444; font-size:0.8rem; margin-bottom:12px; display:none;"></div>
      <button class="btn-primary" id="btn-login" style="width:100%; justify-content:center; padding:10px 0;" onclick="submitLogin()">ログイン</button>
    </div>
  </div>

  <!-- サイドバー -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <i class="fa-solid fa-gem"></i> VTuber Admin
    </div>
    <ul class="nav-list">
      <li class="nav-item active" onclick="switchNav('profile', '基本プロフィール')"><i class="fa-solid fa-id-card"></i> 基本プロフィール</li>
      <li class="nav-item" onclick="switchNav('global_regulations', '基本設定')"><i class="fa-solid fa-sliders"></i> 基本設定</li>
      <li class="nav-item" onclick="switchNav('notice', 'お知らせ')"><i class="fa-solid fa-bullhorn"></i> お知らせ</li>
      <li class="nav-item" onclick="switchNav('visual', '立ち絵')"><i class="fa-solid fa-image"></i> 立ち絵</li>
      <li class="nav-item" onclick="switchNav('movies_priority', '動画カテゴリ')"><i class="fa-solid fa-layer-group"></i> 動画カテゴリ</li>
      <li class="nav-item" onclick="switchNav('movies', '動画')"><i class="fa-solid fa-play"></i> 動画</li>
      <li class="nav-item" onclick="switchNav('shop', 'ショップ')"><i class="fa-solid fa-bag-shopping"></i> ショップ</li>
      <li class="nav-item" onclick="switchNav('about', 'About')"><i class="fa-solid fa-circle-info"></i> About</li>
      <li class="nav-item" onclick="switchNav('guideline', 'ガイドライン')"><i class="fa-solid fa-book-bookmark"></i> ガイドライン</li>
      <li class="nav-item" onclick="switchNav('account', '管理アカウント')"><i class="fa-solid fa-users-gear"></i> 管理アカウント</li>
    </ul>
    <div class="sidebar-footer">
      <button class="btn-secondary" style="width:100%; justify-content:center;" onclick="logout()"><i class="fa-solid fa-right-from-bracket"></i> ログアウト</button>
    </div>
  </aside>

  <!-- メインコンテンツ -->
  <div class="main-wrapper">
    <header class="top-header">
      <div class="top-title" id="page-title">基本プロフィール</div>
      <button class="btn-sync" onclick="syncAllToGitHub()"><i class="fa-solid fa-rocket"></i> サイトへ反映（GitHubプッシュ）</button>
    </header>

    <div class="content-area">
      
      <!-- 1. 基本プロフィール (Profile) 編集ビュー -->
      <div class="card" id="profile-view">
        <div class="card-title">
          <span><i class="fa-solid fa-id-card" style="color:var(--primary);"></i> 基本情報設定</span>
          <div>
            <button class="btn-secondary" style="padding:6px 12px;" onclick="loadProfileData()"><i class="fa-solid fa-rotate"></i> 再読込</button>
            <button class="btn-primary" style="padding:6px 16px;" onclick="saveProfileAll()"><i class="fa-solid fa-floppy-disk"></i> スプレッドシートに保存</button>
          </div>
        </div>
        <div class="profile-table-wrap">
          <table class="profile-table">
            <thead>
              <tr>
                <th style="width: 240px;">項目名</th>
                <th>設定値</th>
              </tr>
            </thead>
            <tbody id="profile-body">
              <tr><td colspan="2" style="text-align:center; color:#94a3b8; padding:20px;">読み込み中...</td></tr>
            </tbody>
          </table>
        </div>
      </div>

      <!-- 2. 通常シート一覧ビュー -->
      <div class="card" id="general-view" style="display:none;">
        <div class="card-title">
          <span id="sub-card-title">データ一覧</span>
          <div>
            <button class="btn-secondary" style="padding:6px 12px;" onclick="loadCurrentTableData()"><i class="fa-solid fa-rotate"></i> 再読込</button>
            <button class="btn-success" style="padding:6px 12px;" onclick="openCreateModal()"><i class="fa-solid fa-plus"></i> 新規追加</button>
          </div>
        </div>

        <div class="table-wrap">
          <table>
            <thead><tr id="table-head"></tr></thead>
            <tbody id="table-body"></tbody>
          </table>
        </div>
      </div>

    </div>
  </div>

  <!-- 編集/追加モーダル -->
  <div class="modal-overlay" id="form-modal">
    <div class="modal-box">
      <div class="modal-header">
        <h3 id="modal-title">データ編集</h3>
        <button onclick="closeModal()" style="background:none; border:none; font-size:1.4rem; cursor:pointer;">&times;</button>
      </div>
      <div class="modal-body" id="modal-fields"></div>
      <div class="modal-footer">
        <button class="btn-secondary" onclick="closeModal()">キャンセル</button>
        <button class="btn-primary" id="btn-save-row" onclick="submitRowForm()"><i class="fa-solid fa-floppy-disk"></i> スプレッドシートに保存</button>
      </div>
    </div>
  </div>

  <div id="loading-toast"><i class="fa-solid fa-spinner fa-spin"></i> <span id="toast-text">処理中...</span></div>

  <script>
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbxYlAr1y9mOf_WSLpsmR42yt8aJZ4oxjys4Hheu59wxlbTR-GmgE1btDEI73s-BrBJr/exec";

    // フォールバック用スキーマ定義
    const DEFAULT_SCHEMA = {
      "notice": {
        "title": "お知らせ",
        "headerRow": 1,
        "dataStartRow": 2,
        "columns": {
          "time_stamp": { "label": "日時", "type": "datetime", "required": true },
          "message": { "label": "本文", "type": "textarea", "rows": 4, "required": true },
          "picture": { "label": "画像・動画URL", "type": "url", "required": false }
        }
      },
      "global_regulations": {
        "title": "基本設定",
        "headerRow": 1,
        "dataStartRow": 2,
        "columns": {
          "item": { "label": "用途", "type": "text", "required": true },
          "type": { "label": "形式", "type": "select", "options": ["画像url", "テキスト", "その他"], "required": true }
        }
      },
      "visual": {
        "title": "立ち絵",
        "headerRow": 1,
        "dataStartRow": 2,
        "columns": {
          "id": { "label": "管理番号", "type": "number", "required": true },
          "costume_name": { "label": "イラスト名(管理用)", "type": "text", "required": false },
          "visual_url": { "label": "立ち絵画像URL", "type": "url", "required": true },
          "thumb_background": { "label": "アイコン背景画像URL", "type": "url", "required": true },
          "comment": { "label": "立ち絵説明(管理用)", "type": "text", "required": false },
          "character_design": { "label": "キャラクター案", "type": "text", "required": false },
          "illustrator": { "label": "イラストレーター", "type": "text", "required": false },
          "2d_animation": { "label": "2Dデザイナー", "type": "text", "required": false },
          "3d_modeling": { "label": "3Dモデリング", "type": "text", "required": false },
          "priority": { "label": "表示順（優先度）", "type": "number", "min": 1, "required": true }
        }
      },
      "movies_priority": {
        "title": "動画カテゴリ",
        "headerRow": 1,
        "dataStartRow": 2,
        "columns": {
          "type": { "label": "動画カテゴリ", "type": "text", "required": true },
          "priority": { "label": "表示順（優先度）", "type": "number", "min": 1, "required": true }
        }
      },
      "movies": {
        "title": "動画",
        "headerRow": 1,
        "dataStartRow": 2,
        "columns": {
          "type": { "label": "動画カテゴリ", "type": "text", "required": true },
          "title": { "label": "動画タイトル", "type": "relation_select", "fromSheet": "movies_priority", "fromColumn": "type", "required": true },
          "image_url": { "label": "サムネイル画像URL", "type": "url", "required": false },
          "video_url": { "label": "動画URL", "type": "url", "required": true },
          "is_active": { "label": "公開設定", "type": "select", "options": ["true", "false"], "optionLabels": ["公開", "非公開"], "required": true }
        }
      },
      "shop": {
        "title": "ショップ",
        "headerRow": 1,
        "dataStartRow": 2,
        "columns": {
          "id": { "label": "管理番号", "type": "number", "required": true },
          "name": { "label": "商品名", "type": "text", "required": true },
          "merchandise_image": { "label": "商品画像URL", "type": "url", "required": true },
          "price": { "label": "価格（円）", "type": "number", "required": true },
          "booth": { "label": "BOOTH", "type": "url", "required": false },
          "suzuri": { "label": "SUZURI", "type": "url", "required": false },
          "base": { "label": "BASE", "type": "url", "required": false },
          "fanbox": { "label": "FANBOX", "type": "url", "required": false }
        }
      },
      "about": {
        "title": "その他",
        "headerRow": 1,
        "dataStartRow": 2,
        "columns": {
          "title": { "label": "タイトル", "type": "text", "required": true },
          "line": { "label": "表示ライン", "type": "number", "min": 1, "required": true },
          "type": { "label": "表示種類", "type": "select", "options": ["ボタンリンク", "ストア", "メール", "テキスト"], "required": true },
          "button_image": { "label": "ボタン画像URL", "type": "url", "required": true },
          "value": { "label": "設定値", "type": "text", "required": true },
          "title_value": { "label": "メール件名", "type": "text", "required": false },
          "text_value": { "label": "メール本文", "type": "textarea", "rows": 6, "required": false },
          "priority": { "label": "表示順（優先度）", "type": "number", "min": 1, "required": true }
        }
      },
      "guideline": {
        "title": "その他",
        "headerRow": 1,
        "dataStartRow": 2,
        "columns": {
          "text_value": { "label": "テキストタイプ", "type": "select", "options": ["タイトル", "項目", "テキスト", "段落テキスト", "注釈"], "required": true },
          "paragraph_group": { "label": "段落グループ", "type": "number", "min": 1, "required": false },
          "is_active": { "label": "太字可否", "type": "select", "options": ["true", "false"], "optionLabels": ["太字", "通常"], "required": true },
          "text": { "label": "テキスト", "type": "text", "required": false },
          "priority": { "label": "表示順（優先度）", "type": "number", "min": 1, "required": true }
        }
      },
      "profile": {
        "title": "基本プロフィール",
        "layout": "key-value",
        "dataStartRow": 1,
        "keyColumn": 1,
        "valueColumn": 2,
        "descColumn": 3,
        "items": {
          "name": { "label": "キャラクター名", "type": "text", "required": true },
          "pronunciation": { "label": "ふりがな", "type": "text", "required": true },
          "romanization": { "label": "ローマ字", "type": "text", "required": true },
          "birthday": { "label": "誕生日", "type": "date", "format": "MM月DD日", "required": false },
          "streaming": { "label": "配信活動開始日", "type": "date", "format": "YYYY年MM月DD日", "required": false },
          "age": { "label": "年齢", "type": "number", "min": 0, "required": false },
          "height": { "label": "身長(cm)", "type": "number", "required": false },
          "fan_name": { "label": "ファンネーム", "type": "text", "required": false },
          "comment": { "label": "キャッチフレーズ", "type": "text", "required": false },
          "message": { "label": "自己紹介メッセージ", "type": "textarea", "rows": 3, "required": false },
          "youtube_url": { "label": "YouTubeチャンネルURL", "type": "url", "required": false },
          "x_url": { "label": "X (旧Twitter) URL", "type": "url", "required": false },
          "sns_url-1": { "label": "配信プラットフォーム-1", "type": "url", "required": false },
          "sns_url-2": { "label": "配信プラットフォーム-2", "type": "url", "required": false },
          "sns_url-3": { "label": "配信プラットフォーム-3", "type": "url", "required": false },
          "movie_url-1": { "label": "自己紹介動画URL-1", "type": "url", "required": false },
          "movie_url-2": { "label": "自己紹介動画URL-2", "type": "url", "required": false },
          "movie_url-3": { "label": "自己紹介動画URL-3", "type": "url", "required": false }
        }
      },
      "account": {
        "title": "管理アカウント",
        "headerRow": 1,
        "dataStartRow": 2,
        "columns": {
          "account": { "label": "アカウント", "type": "text", "required": true },
          "password": { "label": "パスワード", "type": "text", "required": true },
          "authority": { "label": "権限", "type": "text", "required": true }
        }
      }
    };

    let APP_SCHEMA = DEFAULT_SCHEMA;
    let currentActiveSheet = 'profile';
    let currentHeaders = [];
    let currentRows = [];
    let editingRowIndex = null;
    let profileRawRows = [];
    let relationCache = {}; // relation_select用のキャッシュ

    function showToast(text) {
      document.getElementById('toast-text').textContent = text;
      document.getElementById('loading-toast').classList.add('show');
    }
    function hideToast() {
      document.getElementById('loading-toast').classList.remove('show');
    }

    // スキーマ読み込み (schema.yaml または schema.json)
    async function loadSchemaConfig() {
      try {
        const resYaml = await fetch('./schema.yaml');
        if (resYaml.ok) {
          const yamlText = await resYaml.text();
          APP_SCHEMA = jsyaml.load(yamlText);
          console.log('schema.yaml を読み込みました');
          return;
        }
      } catch (e) {}

      try {
        const resJson = await fetch('./schema.json');
        if (resJson.ok) {
          APP_SCHEMA = await resJson.json();
          console.log('schema.json を読み込みました');
          return;
        }
      } catch (e) {}

      console.log('内蔵デフォルトスキーマを使用します');
    }

    window.onload = async function() {
      await loadSchemaConfig();
      if (sessionStorage.getItem('admin_user_authed')) {
        document.getElementById('login-overlay').style.display = 'none';
        initApp();
      }
    };

    async function submitLogin() {
      const acc = document.getElementById('login-account').value.trim();
      const pass = document.getElementById('login-password').value.trim();
      const errMsg = document.getElementById('login-err-msg');
      const btn = document.getElementById('btn-login');

      if (!acc || !pass) {
        errMsg.textContent = 'アカウント名とパスワードを入力してください';
        errMsg.style.display = 'block';
        return;
      }

      btn.disabled = true;
      btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> 認証中...';
      errMsg.style.display = 'none';

      try {
        const res = await fetch(`${GAS_API_URL}?action=verifyAccount&account=${encodeURIComponent(acc)}&password=${encodeURIComponent(pass)}`);
        const data = await res.json();
        btn.disabled = false;
        btn.innerHTML = 'ログイン';

        if (data.success) {
          sessionStorage.setItem('admin_user_authed', data.user || acc);
          document.getElementById('login-overlay').style.display = 'none';
          initApp();
        } else {
          errMsg.textContent = data.message;
          errMsg.style.display = 'block';
        }
      } catch (err) {
        btn.disabled = false;
        btn.innerHTML = 'ログイン';
        errMsg.textContent = '通信エラー: ' + err.message;
        errMsg.style.display = 'block';
      }
    }

    function logout() {
      sessionStorage.removeItem('admin_user_authed');
      location.reload();
    }

    function initApp() {
      switchNav('profile', '基本プロフィール');
    }

    // 1. ナビゲーション切り替え
    function switchNav(sheetName, title) {
      currentActiveSheet = sheetName;
      document.getElementById('page-title').textContent = title;

      document.querySelectorAll('.nav-list .nav-item').forEach(el => {
        el.classList.remove('active');
        if (el.textContent.includes(title)) {
          el.classList.add('active');
        }
      });

      const isProfile = (sheetName === 'profile');
      document.getElementById('profile-view').style.display = isProfile ? 'block' : 'none';
      document.getElementById('general-view').style.display = isProfile ? 'none' : 'block';

      if (isProfile) {
        loadProfileData();
      } else {
        loadCurrentTableData();
      }
    }

    // 2. 基本プロフィール (Profile) の読み込み & 描画（スキーマ適用）
    async function loadProfileData() {
      showToast('基本プロフィールを読み込み中...');
      try {
        const res = await fetch(`${GAS_API_URL}?action=getSheetData&sheetName=profile`);
        const data = await res.json();
        hideToast();
        profileRawRows = data.rows || [];
        const tbody = document.getElementById('profile-body');
        tbody.innerHTML = '';

        if (profileRawRows.length === 0) {
          tbody.innerHTML = '<tr><td colspan="2" style="text-align:center; color:#94a3b8; padding:20px;">データがありません</td></tr>';
          return;
        }

        const schemaItems = (APP_SCHEMA.profile && APP_SCHEMA.profile.items) ? APP_SCHEMA.profile.items : {};

        profileRawRows.forEach(row => {
          const key = row.key;
          const conf = schemaItems[key] || {};
          const labelName = conf.label || key;
          const isReq = conf.required ? '<span class="required-badge">*必須</span>' : '';
          const placeholder = conf.placeholder || '';
          const inputType = conf.type || 'text';
          const val = row.value !== undefined ? row.value : '';

          const tr = document.createElement('tr');
          let inputHtml = '';

          if (inputType === 'textarea') {
            const rows = conf.rows || 3;
            inputHtml = `<textarea class="profile-input" id="prof-val-${row._rowIndex}" rows="${rows}" placeholder="${placeholder}">${val}</textarea>`;
          } else if (inputType === 'number') {
            const minAttr = conf.min !== undefined ? `min="${conf.min}"` : '';
            inputHtml = `<input type="number" class="profile-input" id="prof-val-${row._rowIndex}" value="${val}" ${minAttr} placeholder="${placeholder}">`;
          } else if (inputType === 'date') {
            inputHtml = `<input type="text" class="profile-input" id="prof-val-${row._rowIndex}" value="${val}" placeholder="${conf.format || placeholder || 'YYYY-MM-DD'}">`;
          } else {
            inputHtml = `<input type="text" class="profile-input" id="prof-val-${row._rowIndex}" value="${val}" placeholder="${placeholder}">`;
          }

          tr.innerHTML = `
            <td class="profile-key">
              ${labelName} ${isReq}
              <div class="profile-desc">${key}${row.desc ? ` / ${row.desc}` : ''}</div>
            </td>
            <td>${inputHtml}</td>
          `;
          tbody.appendChild(tr);
        });
      } catch (err) {
        hideToast();
        console.error('Profile load error:', err);
      }
    }

    // 基本プロフィールの保存
    async function saveProfileAll() {
      const schemaItems = (APP_SCHEMA.profile && APP_SCHEMA.profile.items) ? APP_SCHEMA.profile.items : {};
      
      // バリデーション
      for (let row of profileRawRows) {
        const conf = schemaItems[row.key] || {};
        const val = document.getElementById(`prof-val-${row._rowIndex}`).value.trim();
        if (conf.required && !val) {
          alert(`【${conf.label || row.key}】は入力必須です。`);
          document.getElementById(`prof-val-${row._rowIndex}`).focus();
          return;
        }
      }

      showToast('基本プロフィールを保存中...');
      const payloadList = profileRawRows.map(row => ({
        rowIndex: row._rowIndex,
        value: document.getElementById(`prof-val-${row._rowIndex}`).value
      }));

      try {
        const res = await fetch(GAS_API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ action: 'saveProfileBatch', profileData: payloadList })
        });
        const resData = await res.json();
        hideToast();
        alert(resData.message);
      } catch (e) {
        hideToast();
        alert('保存エラー: ' + e.message);
      }
    }

    // 3. 通常シートのデータ読み込み & テーブル描画（スキーマ日本語ヘッダー適用）
    async function loadCurrentTableData() {
      showToast(`「${currentActiveSheet}」を読み込み中...`);
      try {
        const res = await fetch(`${GAS_API_URL}?action=getSheetData&sheetName=${encodeURIComponent(currentActiveSheet)}`);
        const data = await res.json();
        hideToast();

        currentHeaders = data.headers || [];
        currentRows = data.rows || [];
        renderTable();
      } catch (err) {
        hideToast();
        alert('読み込み失敗: ' + err.message);
      }
    }

    function renderTable() {
      const head = document.getElementById('table-head');
      const body = document.getElementById('table-body');
      head.innerHTML = '<th>操作</th>';
      body.innerHTML = '';

      const sheetConf = APP_SCHEMA[currentActiveSheet] || { columns: {} };
      const colConfs = sheetConf.columns || {};

      currentHeaders.forEach(h => {
        const th = document.createElement('th');
        const conf = colConfs[h] || {};
        th.textContent = conf.label || h;
        head.appendChild(th);
      });

      if (currentRows.length === 0) {
        body.innerHTML = `<tr><td colspan="${currentHeaders.length + 1}" style="text-align:center; padding:24px; color:#94a3b8;">データがありません</td></tr>`;
        return;
      }

      currentRows.forEach((row, idx) => {
        const tr = document.createElement('tr');
        const tdOp = document.createElement('td');
        tdOp.innerHTML = `
          <button class="btn-primary" style="padding:4px 8px; font-size:0.75rem;" onclick="openEditModal(${idx})"><i class="fa-solid fa-pen"></i></button>
          <button class="btn-danger" style="padding:4px 8px; font-size:0.75rem;" onclick="deleteRow(${row._rowIndex})"><i class="fa-solid fa-trash"></i></button>
        `;
        tr.appendChild(tdOp);

        currentHeaders.forEach(h => {
          const td = document.createElement('td');
          const val = row[h] !== undefined ? row[h] : '';
          const conf = colConfs[h] || {};

          // selectでラベル指定がある場合の表示変換
          if (conf.type === 'select' && conf.options && conf.optionLabels) {
            const optIdx = conf.options.indexOf(String(val));
            td.textContent = optIdx !== -1 && conf.optionLabels[optIdx] ? conf.optionLabels[optIdx] : val;
          } else {
            td.textContent = val;
          }
          tr.appendChild(td);
        });
        body.appendChild(tr);
      });
    }

    // 4. 動的フォーム生成モーダル（スキーマ完全対応）
    async function openCreateModal() {
      editingRowIndex = null;
      const sheetConf = APP_SCHEMA[currentActiveSheet] || {};
      document.getElementById('modal-title').textContent = `${sheetConf.title || currentActiveSheet} に新規追加`;
      await renderModalFields({});
      document.getElementById('form-modal').classList.add('show');
    }

    async function openEditModal(rowIndexInArray) {
      const row = currentRows[rowIndexInArray];
      editingRowIndex = row._rowIndex;
      const sheetConf = APP_SCHEMA[currentActiveSheet] || {};
      document.getElementById('modal-title').textContent = `${sheetConf.title || currentActiveSheet} の編集 (行: ${editingRowIndex})`;
      await renderModalFields(row);
      document.getElementById('form-modal').classList.add('show');
    }

    async function renderModalFields(data) {
      const container = document.getElementById('modal-fields');
      container.innerHTML = '<div style="text-align:center; padding:20px; color:#94a3b8;"><i class="fa-solid fa-spinner fa-spin"></i> フォーム生成中...</div>';

      const sheetConf = APP_SCHEMA[currentActiveSheet] || { columns: {} };
      const colConfs = sheetConf.columns || {};
      const fieldsFragment = document.createDocumentFragment();

      for (const h of currentHeaders) {
        const conf = colConfs[h] || {};
        const labelText = conf.label || h;
        const isReq = conf.required ? '<span class="required-badge">*必須</span>' : '';
        const inputType = conf.type || 'text';
        const val = data[h] !== undefined ? data[h] : '';

        const grp = document.createElement('div');
        grp.className = 'form-group';
        grp.innerHTML = `<label>${labelText} ${isReq} <span style="font-size:0.75rem; color:#94a3b8; font-weight:normal;">(${h})</span></label>`;

        if (inputType === 'textarea') {
          const textarea = document.createElement('textarea');
          textarea.rows = conf.rows || 3;
          textarea.id = `field-${h}`;
          textarea.value = val;
          grp.appendChild(textarea);

        } else if (inputType === 'select') {
          const select = document.createElement('select');
          select.id = `field-${h}`;
          select.innerHTML = '<option value="">-- 選択してください --</option>';

          const opts = conf.options || [];
          const optLabels = conf.optionLabels || opts;
          opts.forEach((optVal, i) => {
            const opt = document.createElement('option');
            opt.value = optVal;
            opt.textContent = optLabels[i] || optVal;
            if (String(optVal) === String(val)) opt.selected = true;
            select.appendChild(opt);
          });
          grp.appendChild(select);

        } else if (inputType === 'relation_select') {
          const select = document.createElement('select');
          select.id = `field-${h}`;
          select.innerHTML = '<option value="">-- 選択してください --</option>';

          const optionsList = await fetchRelationOptions(conf.fromSheet, conf.fromColumn);
          optionsList.forEach(optVal => {
            const opt = document.createElement('option');
            opt.value = optVal;
            opt.textContent = optVal;
            if (String(optVal) === String(val)) opt.selected = true;
            select.appendChild(opt);
          });
          grp.appendChild(select);

        } else if (inputType === 'number') {
          const input = document.createElement('input');
          input.type = 'number';
          input.id = `field-${h}`;
          input.value = val;
          if (conf.min !== undefined) input.min = conf.min;
          if (conf.max !== undefined) input.max = conf.max;
          if (conf.step !== undefined) input.step = conf.step;
          grp.appendChild(input);

        } else if (inputType === 'datetime') {
          const input = document.createElement('input');
          input.type = 'text';
          input.id = `field-${h}`;
          input.value = val;
          input.placeholder = 'YYYY-MM-DD HH:mm:ss';
          grp.appendChild(input);

        } else if (inputType === 'url') {
          const input = document.createElement('input');
          input.type = 'url';
          input.id = `field-${h}`;
          input.value = val;
          input.placeholder = 'https://...';
          grp.appendChild(input);

          // 画像プレビュー枠（画像系URLの場合）
          if (h.includes('image') || h.includes('visual') || h.includes('thumb') || h.includes('picture')) {
            const prev = document.createElement('div');
            prev.className = 'field-preview';
            prev.id = `prev-${h}`;
            if (val && val.startsWith('http')) {
              prev.innerHTML = `<img src="${val}" onerror="this.style.display='none'">`;
            }
            input.oninput = () => {
              if (input.value.startsWith('http')) {
                prev.innerHTML = `<img src="${input.value}" onerror="this.style.display='none'">`;
              } else {
                prev.innerHTML = '';
              }
            };
            grp.appendChild(prev);
          }

        } else {
          const input = document.createElement('input');
          input.type = 'text';
          input.id = `field-${h}`;
          input.value = val;
          grp.appendChild(input);
        }

        fieldsFragment.appendChild(grp);
      }

      container.innerHTML = '';
      container.appendChild(fieldsFragment);
    }

    // 別シートの選択肢を動的取得するヘルパー
    async function fetchRelationOptions(fromSheet, fromColumn) {
      if (!fromSheet || !fromColumn) return [];
      const cacheKey = `${fromSheet}_${fromColumn}`;
      if (relationCache[cacheKey]) return relationCache[cacheKey];

      try {
        const res = await fetch(`${GAS_API_URL}?action=getSheetData&sheetName=${encodeURIComponent(fromSheet)}`);
        const data = await res.json();
        const rows = data.rows || [];
        const uniqueSet = new Set();

        rows.forEach(r => {
          const val = r[fromColumn];
          if (val !== undefined && val !== null && String(val).trim() !== '') {
            uniqueSet.add(String(val).trim());
          }
        });

        const list = Array.from(uniqueSet);
        relationCache[cacheKey] = list;
        return list;
      } catch (e) {
        console.error('Relation options error:', e);
        return [];
      }
    }

    function closeModal() {
      document.getElementById('form-modal').classList.remove('show');
    }

    // 5. 保存（バリデーション＋スプレッドシート書き込み）
    async function submitRowForm() {
      const sheetConf = APP_SCHEMA[currentActiveSheet] || { columns: {} };
      const colConfs = sheetConf.columns || {};
      const rowData = {};

      // スキーマバリデーションチェック
      for (const h of currentHeaders) {
        const fieldEl = document.getElementById(`field-${h}`);
        const val = fieldEl ? fieldEl.value.trim() : '';
        const conf = colConfs[h] || {};

        if (conf.required && !val) {
          alert(`【${conf.label || h}】は入力必須です。`);
          if (fieldEl) fieldEl.focus();
          return;
        }
        rowData[h] = fieldEl ? fieldEl.value : '';
      }

      const btn = document.getElementById('btn-save-row');
      btn.disabled = true;
      showToast('シートに保存中...');

      try {
        const res = await fetch(GAS_API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({
            action: 'saveRow',
            sheetName: currentActiveSheet,
            rowIndex: editingRowIndex,
            rowData: rowData
          })
        });
        const resData = await res.json();
        hideToast();
        btn.disabled = false;

        if (resData.success) {
          closeModal();
          alert(resData.message);
          // relationCache をクリアして次回の参照を最新化
          relationCache = {};
          loadCurrentTableData();
        } else {
          alert('エラー: ' + resData.message);
        }
      } catch (err) {
        hideToast();
        btn.disabled = false;
        alert('通信エラー: ' + err.message);
      }
    }

    // 6. 削除
    async function deleteRow(rowIndex) {
      if (!confirm(`行番号: ${rowIndex} を削除しますか？`)) return;
      showToast('削除中...');

      try {
        const res = await fetch(GAS_API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({
            action: 'deleteRow',
            sheetName: currentActiveSheet,
            rowIndex: rowIndex
          })
        });
        const resData = await res.json();
        hideToast();
        if (resData.success) {
          alert(resData.message);
          relationCache = {};
          loadCurrentTableData();
        }
      } catch (err) {
        hideToast();
        alert('通信エラー: ' + err.message);
      }
    }

    // 7. 一括GitHubプッシュ
    async function syncAllToGitHub() {
      if (!confirm('スプレッドシートの全データをJSON化してGitHub（本番サイト）へ反映しますか？')) return;
      showToast('GitHubへデータをプッシュ中...');

      try {
        const res = await fetch(GAS_API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ action: 'syncAllToGitHub' })
        });
        const resData = await res.json();
        hideToast();
        alert(resData.message);
      } catch (err) {
        hideToast();
        alert('GitHubプッシュエラー: ' + err.message);
      }
    }
  </script>
</body>
</html>
